<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e6e9f2;--pri:#4f46e5;--pri-d:#3730a3;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--lv:#d97706;--lvb:#fef3c7;--off:#0891b2;--offb:#cffafe;--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:236px;background:linear-gradient(180deg,#1e1b4b 0%,#312e81 100%);color:#e0e7ff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 20px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#22d3ee);display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 6px 16px rgba(34,211,238,.25)}
.brand b{display:block;font-size:14px;color:#fff;line-height:1.2}.brand small{color:#a5b4fc;font-size:11.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c7d2fe;text-decoration:none;font-weight:550;margin-bottom:3px;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri-d);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.side .foot{margin-top:auto;font-size:11.5px;color:#a5b4fc;padding:8px;line-height:1.5}
.main{flex:1;margin-left:236px;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:var(--pri-d);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill.g{background:var(--okb);color:#166534}.pill.o{background:var(--lvb);color:#92400e}.pill.r{background:var(--badb);color:#991b1b}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1.1fr 2fr;gap:14px}
.stack>*+*{margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px 18px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#4f46e5)}
.kpi .l{padding-right:38px;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{white-space:nowrap;font-size:27px;font-weight:800;margin-top:3px;letter-spacing:-.02em;color:var(--ink)}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cb,#eef2ff);color:var(--c,#4f46e5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{border-color:#c7cbe0;background:#fafbff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-width:0;outline:none}
select:focus,input:focus,textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #e0e7ff}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:12px;color:var(--mut);font-weight:650}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}
table{border-collapse:collapse;width:100%}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl table th{background:#f6f7fc;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#475569;text-align:left;position:sticky;top:0;z-index:1}
.tbl table th,.tbl table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl table tr:last-child td{border-bottom:none}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.c,.tbl th.c{text-align:center}
tr.sub td{background:#f8f9ff;font-weight:700}
tr.tot td{background:#eef2ff;font-weight:800;color:var(--pri-d)}
tr.dh td{background:#fbfbfe;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:650;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .ck{font-size:11px;color:var(--ok)}.chip.on .ck{color:#bbf7d0}
.tabs{display:flex;gap:4px;background:#e9ecf6;border-radius:12px;padding:4px;overflow:auto;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:650;color:#475569;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--pri-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* roll call */
.rsum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rsum div{border-radius:12px;padding:8px 10px;text-align:center;background:#f6f7fc}
.rsum b{display:block;font-size:20px}.rsum span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
.rsum .p{background:var(--okb)}.rsum .p b{color:#15803d}.rsum .a{background:var(--badb)}.rsum .a b{color:#b91c1c}.rsum .lv{background:var(--lvb)}.rsum .lv b{color:#b45309}
.srow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.roll{width:34px;height:34px;border-radius:10px;background:#eef2ff;color:var(--pri-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.nm small{color:var(--mut);font-size:11.5px}
.seg{display:flex;gap:5px;flex:none}
.seg button{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:#94a3b8;transition:.1s}
.seg .P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .A.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .L.on{background:var(--lv);border-color:var(--lv);color:#fff}
.srow.mP .roll{background:var(--okb);color:#15803d}.srow.mA .roll{background:var(--badb);color:#b91c1c}.srow.mL .roll{background:var(--lvb);color:#b45309}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.o{background:var(--lvb);color:#92400e}.banner.i{background:#eef2ff;color:var(--pri-d)}
/* charts */
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;position:relative;min-height:2px}
.col .bv{font-size:10.5px;font-weight:700;color:#334155;margin-bottom:3px;white-space:nowrap}
.col .bl{font-size:10.5px;color:var(--mut);margin-top:5px;white-space:nowrap}
.hb{margin-bottom:11px}.hb .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}.hb .t b{font-weight:650}
.hb .tr{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#eef0f6}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:160px;height:160px;flex:none}
.lst{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.lst div{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.mini{height:7px;border-radius:9px;background:#eef0f6;overflow:hidden;min-width:60px}.mini i{display:block;height:100%;border-radius:9px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800;font-size:11px}
.cell.P{background:var(--okb);color:#15803d}.cell.A{background:var(--badb);color:#b91c1c}.cell.L{background:var(--lvb);color:#b45309}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;border-left:5px solid var(--c)}
.dcard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dcard .hd b{font-size:15px}
.sc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 10px;font-weight:650;background:#fafbff}
.sc button{border:0;background:transparent;cursor:pointer;color:#94a3b8;padding:2px 5px;border-radius:6px}.sc button:hover{background:#eef0f6;color:var(--bad)}
.capbar{height:8px;border-radius:9px;background:#eef0f6;overflow:hidden;width:140px}.capbar i{display:block;height:100%}
/* modal & toast */
.mwrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:100;padding:14px;animation:fd .15s}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.mh b{font-size:16px}
.mh .x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
.mb{padding:16px;overflow:auto}.mb p{margin:0 0 8px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;font-size:13.5px}
.toast button{background:#334155;color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:650;cursor:pointer}
.bnav{display:none}
.rh{display:none}
.muted{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.lvc{color:var(--lv)}
.right{text-align:right}
.sig{display:none}
@media (max-width:1100px){.g3{grid-template-columns:1fr}}
@media (max-width:860px){
 .side{display:none}.main{margin:0;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
 .g2{grid-template-columns:1fr}.form{grid-template-columns:1fr}
 .top h1{font-size:19px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:9px}.kpi .v{font-size:23px}.kpi .ic{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#64748b;text-decoration:none;font-weight:650;padding:4px 0;border-radius:10px;cursor:pointer}
 .bnav a.on{color:var(--pri)}
 .bnav a.on svg{background:#eef2ff;border-radius:9px;padding:3px;width:34px}
 .seg button{width:42px;height:40px}
 .rsum b{font-size:17px}
 .cols{height:160px}.col .bl{font-size:9px}.col .bv{font-size:9px}
}
@media print{
 @page{size:A4;margin:11mm}
 body{background:#fff;font-size:11.5px}
 .side,.bnav,.noprint,.top,.tabs,.toast{display:none!important}
 .main{margin:0;padding:0}
 .card{box-shadow:none;border:0;padding:0}
 .rh{display:block;text-align:center;border-bottom:2px solid #312e81;padding-bottom:8px;margin-bottom:12px}
 .rh h2{margin:0;font-size:18px;color:#312e81}.rh div{font-size:12px}
 .tbl{border:1px solid #cbd5e1;overflow:visible;border-radius:0}
 .tbl table th,.tbl table td{padding:4px 6px;border:1px solid #cbd5e1}
 .tbl table th{position:static}
 .sig{display:flex;justify-content:space-between;margin-top:46px;font-weight:700}
 .sig span{border-top:1px solid #000;padding-top:4px;min-width:160px;text-align:center}
 .cell{width:16px;height:16px;font-size:9px}
 tr{page-break-inside:avoid}
 .landscape-hint{display:none}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="logo" id="logoIc"></div><div><b id="brandOrg">St. James H.S. School</b><small>Sunday School Attendance</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="foot"><div id="netState"></div><div id="saveState" style="margin-top:4px"></div><div style="margin-top:6px;opacity:.8">v1.0 · works offline</div></div>
 </aside>
 <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* ============ Basics ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#84cc16','#f97316'];
const DEFAULT_DEPTS=['Beginners','Primary','Junior','Baptisma','Intermediate','Senior'];
const ROLES=['Superintendent','Asst. Superintendent','Secretary','Treasurer','Teacher','Asst. Teacher'];
const IC={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 roll:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 teach:'<circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>',
 stud:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 rep:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 cross:'<path d="M12 2v20M5 8h14"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 leave:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
 pct:'<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
 up:'<path d="M18 15l-6-6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>'
};
const svg=(k,s=19)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||k}</svg>`;
const VIEWS=[['dashboard','Dashboard','dash'],['rollcall','Roll Call','roll'],['teachers','Teachers','teach'],['students','Students','stud'],['reports','Reports','rep'],['setup','Setup','set']];

/* ============ Storage (IndexedDB + localStorage mirror) ============ */
const KEY='sjs_sunday_school_v1';
const Store={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('sjs_sunday_school',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 get(){return new Promise(res=>{let done=false;const ls=()=>{try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}};
  if(!this.db)return res(ls());
  try{const q=this.db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||ls());q.onerror=()=>res(ls())}catch(e){res(ls())}})},
 put(v){let ok=false;
  if(this.db){try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,'state');tx.oncomplete=()=>setSaved(true);tx.onerror=()=>setSaved(false);ok=true}catch(e){}}
  try{localStorage.setItem(KEY,JSON.stringify(v));if(!this.db)setSaved(true)}catch(e){if(!ok)setSaved(false)}
 }
};
let S,_idx=null,saveT=null;
const U={view:'dashboard',tTab:'att',rTab:'weekly',sTab:'settings',dashDept:'all',search:'',rDept:'all',rLow:false};
function save(){_idx=null;setSaved('saving');clearTimeout(saveT);saveT=setTimeout(flush,300)}
function flush(){clearTimeout(saveT);saveT=null;Store.put(S)}
function setSaved(v){const e=$('#saveState');if(!e)return;e.innerHTML=v==='saving'?'● Saving…':v?'<span style="color:#86efac">●</span> All changes saved on this device':'<span style="color:#fca5a5">●</span> Could not save — export a backup'}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)flush()});
window.addEventListener('pagehide',()=>{if(saveT)flush()});

/* ============ State ============ */
function newId(p){S.seq=(S.seq||1)+1;return p+S.seq.toString(36)}
function defSettings(){return{org:'St. James H.S. School',sub:'Sunday School',place:'Gongrai, Sepahijala, Tripura',session:'2026-2027',start:'2026-03-01',end:'2027-04-30',cur:'₹',low:75,cap:60,supt:'',secy:''}}
function defState(){
 S={v:1,seq:1,settings:defSettings(),
  depts:[],students:[],teachers:[],att:{},tatt:{},off:{},hol:{},lastBackup:null};
 DEFAULT_DEPTS.forEach((n,i)=>S.depts.push({id:newId('d'),name:n,color:COLORS[i%COLORS.length],secs:'ABCDE'.split('').map(x=>({id:newId('c'),name:x}))}));
 return S;
}
function idx(){if(_idx)return _idx;_idx={};S.students.forEach(s=>{(_idx[s.sec]=_idx[s.sec]||[]).push(s)});for(const k in _idx)_idx[k].sort((a,b)=>(a.roll-b.roll)||a.name.localeCompare(b.name));return _idx}
const studentsOf=cid=>idx()[cid]||[];
const deptOf=id=>S.depts.find(d=>d.id===id);
function secInfo(cid){for(const d of S.depts){const c=d.secs.find(c=>c.id===cid);if(c)return{d,c}}return null}
function secLabel(cid){const i=secInfo(cid);return i?`${i.d.name} – ${i.c.name}`:'—'}

/* ============ Dates ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>parse(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fmtS=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const monthName=m=>{const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})};
const monthShort=m=>{const[y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-IN',{month:'short'})+' '+y.slice(2)};
function sundays(){const a=[];let d=parse(S.settings.start);const e=parse(S.settings.end);if(isNaN(d)||isNaN(e))return a;while(d.getDay()!==0)d.setDate(d.getDate()+1);let g=0;while(d<=e&&g++<600){a.push(iso(d));d.setDate(d.getDate()+7)}return a}
function months(){const a=[];let d=parse(S.settings.start);d.setDate(1);const e=parse(S.settings.end);let g=0;while(d<=e&&g++<60){a.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d.setMonth(d.getMonth()+1)}return a}
function defaultSunday(){const su=sundays();if(!su.length)return iso(new Date());const t=iso(new Date());let b=su[0];for(const x of su)if(x<=t)b=x;return b}
function isHeld(d){if(S.hol[d])return false;const a=S.att[d];if(!a)return false;for(const k in a)for(const _ in a[k])return true;return false}
function heldDates(){return sundays().filter(isHeld)}
function rangeDates(r){const h=heldDates();return r==='session'?h:h.filter(d=>d.startsWith(r))}
const rangeLabel=r=>r==='session'?'Whole Session '+S.settings.session:monthName(r);
function dateOpts(sel){return sundays().map(d=>`<option value="${d}" ${d===sel?'selected':''}>${fmtD(d)}${S.hol[d]?' · No class':isHeld(d)?' ✓':''}</option>`).join('')}
function monthOpts(sel,withSession){return (withSession?`<option value="session" ${sel==='session'?'selected':''}>Whole session</option>`:'')+months().map(m=>`<option value="${m}" ${m===sel?'selected':''}>${monthName(m)}</option>`).join('')}
function deptOpts(sel,all){return (all?`<option value="all">All departments</option>`:'')+S.depts.map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.name)}</option>`).join('')}

/* ============ Stats ============ */
const pct=(p,t)=>t?Math.round(p*1000/t)/10:0;
const money=v=>S.settings.cur+' '+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const num=v=>Number(v||0).toLocaleString('en-IN');
function secStat(date,cid){const st=studentsOf(cid);const m=(S.att[date]||{})[cid]||{};let P=0,A=0,L=0,B=0,G=0;
 for(const s of st){const v=m[s.id];if(v==='P'){P++;if(s.g==='F')G++;else if(s.g==='M')B++}else if(v==='A')A++;else if(v==='L')L++}
 let taken=false;for(const _ in m){taken=true;break}
 return{T:st.length,P,A,L,U:st.length-P-A-L,B,G,off:+(((S.off[date]||{})[cid])||0),taken}}
const KS=['T','P','A','L','U','B','G','off'];
function aggDate(date,f='all'){const o={T:0,P:0,A:0,L:0,U:0,B:0,G:0,off:0,secTaken:0,secTotal:0,depts:[]};
 S.depts.forEach(d=>{if(f!=='all'&&d.id!==f)return;const dd={d,T:0,P:0,A:0,L:0,U:0,B:0,G:0,off:0,secs:[]};
  d.secs.forEach(c=>{const s=secStat(date,c.id);dd.secs.push(Object.assign({c},s));KS.forEach(k=>dd[k]+=s[k]);if(s.T||s.taken){o.secTotal++;if(s.taken)o.secTaken++}});
  KS.forEach(k=>o[k]+=dd[k]);o.depts.push(dd)});
 o.M=o.P+o.A+o.L;return o}
function secRange(cid,dates){const o={held:0,P:0,A:0,L:0,off:0};dates.forEach(d=>{const s=secStat(d,cid);if(s.taken){o.held++;o.P+=s.P;o.A+=s.A;o.L+=s.L}o.off+=s.off});o.M=o.P+o.A+o.L;return o}
function teachersIn(f){return S.teachers.filter(t=>f==='all'||t.dept===f)}
function tStat(date,f='all'){const m=S.tatt[date]||{};const o={T:0,P:0,A:0,L:0};teachersIn(f).forEach(t=>{o.T++;const v=m[t.id];if(v)o[v]++});o.U=o.T-o.P-o.A-o.L;return o}
function offRange(dates,f='all'){let s=0;dates.forEach(d=>{const o=S.off[d]||{};for(const cid in o){if(f!=='all'){const i=secInfo(cid);if(!i||i.d.id!==f)continue}s+=+o[cid]||0}});return s}

/* ============ UI helpers ============ */
function toast(msg,act,fn){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${msg}</span>`;if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{t.remove();fn()};t.appendChild(b)}document.body.appendChild(t);setTimeout(()=>t.remove(),act?7000:2600)}
function modal(title,body,buttons){const w=document.createElement('div');w.className='mwrap';w.innerHTML=`<div class="modal" role="dialog"><div class="mh"><b>${title}</b><button class="x" aria-label="Close">×</button></div><div class="mb">${body}</div><div class="mf"></div></div>`;
 const f=w.querySelector('.mf');(buttons||[{t:'Close'}]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.t;e.onclick=()=>{if(b.fn&&b.fn(w)===false)return;w.remove()};f.appendChild(e)});
 w.querySelector('.x').onclick=()=>w.remove();w.addEventListener('mousedown',e=>{if(e.target===w)w.remove()});
 document.body.appendChild(w);const i=w.querySelector('input:not([type=file]),textarea');if(i&&window.innerWidth>860)setTimeout(()=>i.focus(),60);return w}
function ask(msg,ok='Yes, continue',danger){return new Promise(r=>modal('Please confirm',`<p>${msg}</p>`,[{t:'Cancel',fn:()=>r(false)},{t:ok,cls:danger?'danger':'pri',fn:()=>r(true)}]))}
const val=(w,n)=>{const e=w.querySelector(`[name="${n}"]`);return e?e.value.trim():''};
function download(name,text,type){try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Saved: '+esc(name),'Didn’t download? Copy',()=>copyText(text))}catch(e){copyText(text)}}
function copyText(text){modal('Copy data',`<p class="muted">Your device blocked the download. Copy this text and paste it into a file (or Excel for CSV).</p><textarea style="width:100%;height:220px" readonly>${esc(text.slice(0,2e6))}</textarea>`,[{t:'Close'},{t:'Copy',cls:'pri',fn:w=>{const ta=w.querySelector('textarea');ta.select();try{navigator.clipboard.writeText(text).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(e){document.execCommand('copy');toast('Copied')}return false}}])}
function kpi(l,v,s,c,cb,ic){const L=String(v).replace(/<[^>]+>/g,'').length;return `<div class="kpi" style="--c:${c};--cb:${cb}"><div class="ic">${svg(ic,18)}</div><div class="l">${l}</div><div class="v" style="${L>9?'font-size:'+(L>12?18:21)+'px':''}">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`}
function emptyBox(t,s,btn){return `<div class="card empty"><b>${t}</b>${s}${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`}
function go(v){location.hash=v}

/* ============ Charts ============ */
function donut(parts,center,sub){const tot=parts.reduce((a,p)=>a+p.v,0);const R=58,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 160 160" class="donut"><circle cx="80" cy="80" r="${R}" fill="none" stroke="#eef0f6" stroke-width="20"/>`;
 if(tot)parts.forEach(p=>{const len=p.v/tot*C;if(len>0){s+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${Math.max(len-1.5,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`}off+=len});
 return s+`<text x="80" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">${center}</text><text x="80" y="100" text-anchor="middle" font-size="11" fill="#64748b">${sub}</text></svg>`}
function cols(pts,color,fmt){if(!pts.length)return `<div class="empty" style="padding:30px">No Sundays recorded yet</div>`;const mx=Math.max(...pts.map(p=>p.v),1);
 return `<div class="cols">${pts.map(p=>`<div class="col" title="${esc(p.t||p.l)}"><div class="bv">${fmt?fmt(p.v):p.v}</div><div class="bar" style="height:${Math.max(p.v/mx*100,1.5)}%;background:${p.c||color}"></div><div class="bl">${esc(p.l)}</div></div>`).join('')}</div>`}
function hbar(label,parts,right){const t=parts.reduce((a,p)=>a+p.v,0)||1;return `<div class="hb"><div class="t"><b>${label}</b><span class="muted">${right}</span></div><div class="tr">${parts.map(p=>p.v?`<i style="width:${p.v/t*100}%;background:${p.c}" title="${p.n}: ${p.v}"></i>`:'').join('')}</div></div>`}
const miniBar=(p,c)=>`<div class="mini"><i style="width:${Math.min(p,100)}%;background:${c||(p>=S.settings.low?'#16a34a':p>=50?'#d97706':'#dc2626')}"></i></div>`;
const pctCls=p=>p>=S.settings.low?'ok':p>=50?'lvc':'bad';

/* ============ Router ============ */
function navHTML(){return VIEWS.map(([k,l,i])=>`<a class="${U.view===k?'on':''}" onclick="go('${k}')">${svg(i)}<span>${l}</span></a>`).join('')}
function render(){
 const h=(location.hash||'').replace('#','');if(VIEWS.some(v=>v[0]===h))U.view=h;
 $('#nav').innerHTML=navHTML();$('#bnav').innerHTML=navHTML();
 $('#brandOrg').textContent=S.settings.org;
 const su=sundays();if(!U.date||!su.includes(U.date))U.date=defaultSunday();
 const fn={dashboard:vDash,rollcall:vRoll,teachers:vTeach,students:vStud,reports:vRep,setup:vSetup}[U.view];
 $('#main').innerHTML=fn();window.scrollTo&&window.scrollTo(0,0);
}
function rerender(){const y=window.scrollY;const fn={dashboard:vDash,rollcall:vRoll,teachers:vTeach,students:vStud,reports:vRep,setup:vSetup}[U.view];$('#main').innerHTML=fn();window.scrollTo(0,y)}
function topbar(t,sub,ctl){return `<div class="top"><div><h1>${t}</h1><div class="sub">${sub||esc(S.settings.org)+' · '+esc(S.settings.sub)+' · Session '+esc(S.settings.session)}</div></div><div class="sp"></div>${ctl||''}</div>`}
const setU=(k,v)=>{U[k]=v;rerender()};

/* ============ DASHBOARD ============ */
function vDash(){
 if(!S.depts.length)return topbar('Dashboard')+emptyBox('No departments yet','Add departments and sections in Setup to begin.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 const f=U.dashDept,d=U.date,a=aggDate(d,f),t=tStat(d,f);
 const held=heldDates(),past=held.filter(x=>x<=d).slice(-12);
 const trend=past.map(x=>{const g=aggDate(x,f);return{l:fmtS(x),t:fmtD(x),v:pct(g.P,g.M),off:g.off,P:g.P}});
 const sessOff=offRange(held,f);
 const avg=trend.length?Math.round(held.map(x=>{const g=aggDate(x,f);return pct(g.P,g.M)}).reduce((p,c)=>p+c,0)/held.length*10)/10:0;
 const boys=S.students.filter(s=>{const i=secInfo(s.sec);return i&&(f==='all'||i.d.id===f)&&s.g==='M'}).length;
 const girls=S.students.filter(s=>{const i=secInfo(s.sec);return i&&(f==='all'||i.d.id===f)&&s.g==='F'}).length;
 const ctl=`<div class="ctl"><select onchange="setU('date',this.value)">${dateOpts(d)}</select><select onchange="setU('dashDept',this.value)">${deptOpts(f,true)}</select></div>`;
 let h=topbar('Dashboard','Sunday '+fmtD(d)+' · '+(f==='all'?'All departments':esc(deptOf(f)?.name)),ctl);
 if(S.hol[d])h+=`<div class="banner o" style="margin-bottom:14px">${svg('cal')}<b>No Sunday School on this day</b> — ${esc(S.hol[d])}</div>`;
 else if(!a.secTaken)h+=`<div class="banner i" style="margin-bottom:14px">${svg('roll')}<span>Roll call has not been taken for this Sunday yet.</span><span class="sp"></span><button class="btn sm pri" onclick="go('rollcall')">Take roll call</button></div>`;
 h+=`<div class="kpis">
 ${kpi('Total Students',num(a.T),`Boys ${boys} · Girls ${girls}`,'#4f46e5','#eef2ff','users')}
 ${kpi('Present',num(a.P),pct(a.P,a.T)+'% of enrolled','#16a34a','#dcfce7','check')}
 ${kpi('Absent',num(a.A),pct(a.A,a.T)+'% of enrolled','#dc2626','#fee2e2','x')}
 ${kpi('Leave',num(a.L),a.U?num(a.U)+' not marked':'All marked','#d97706','#fef3c7','leave')}
 ${kpi('Attendance',pct(a.P,a.M)+'%',`${a.secTaken}/${a.secTotal} sections marked`,'#7c3aed','#ede9fe','pct')}
 ${kpi('Offering',money(a.off),'This Sunday','#0891b2','#cffafe','coin')}
 ${kpi('Teachers Present',`${t.P}<span style="font-size:15px;color:#94a3b8">/${t.T}</span>`,`Absent ${t.A} · Leave ${t.L}`,'#db2777','#fce7f3','teach')}
 ${kpi('Session Offering',money(sessOff),`${held.length} Sundays held · avg ${avg}%`,'#0d9488','#ccfbf1','cal')}
 </div>`;
 h+=`<div class="g3" style="margin-top:14px">
 <div class="card"><h3>Attendance split <small>${fmtD(d)}</small></h3><div class="donutw">${donut([{v:a.P,c:'#16a34a'},{v:a.A,c:'#dc2626'},{v:a.L,c:'#d97706'},{v:a.U,c:'#cbd5e1'}],pct(a.P,a.M)+'%','present')}
 <div class="lst"><div><span><i class="dot ok"></i> Present</span><b>${a.P}</b></div><div><span><i class="dot bad"></i> Absent</span><b>${a.A}</b></div><div><span><i class="dot lvc"></i> Leave</span><b>${a.L}</b></div><div><span><i class="dot" style="color:#cbd5e1"></i> Not marked</span><b>${a.U}</b></div><div><span class="muted">Boys / Girls present</span><b>${a.B} / ${a.G}</b></div></div></div></div>
 <div class="card"><h3>Department-wise attendance</h3>${a.depts.map(x=>hbar(`<i class="dot" style="color:${x.d.color}"></i> ${esc(x.d.name)}`,[{v:x.P,c:'#16a34a',n:'Present'},{v:x.L,c:'#f59e0b',n:'Leave'},{v:x.A,c:'#ef4444',n:'Absent'},{v:x.U,c:'#e2e8f0',n:'Not marked'}],`${x.P}/${x.T} · <b class="${pctCls(pct(x.P,x.P+x.A+x.L))}">${pct(x.P,x.P+x.A+x.L)}%</b>`)).join('')||'<div class="muted">No departments</div>'}
 <div class="leg"><span><i style="background:#16a34a"></i>Present</span><span><i style="background:#f59e0b"></i>Leave</span><span><i style="background:#ef4444"></i>Absent</span><span><i style="background:#e2e8f0"></i>Not marked</span></div></div></div>`;
 h+=`<div class="g2" style="margin-top:14px">
 <div class="card"><h3>Attendance trend <small>last ${trend.length} Sundays (%)</small></h3>${cols(trend,'linear-gradient(180deg,#818cf8,#4f46e5)',v=>v+'%')}</div>
 <div class="card"><h3>Offering trend <small>${S.settings.cur} per Sunday</small></h3>${cols(trend.map(x=>({l:x.l,t:x.t,v:x.off})),'linear-gradient(180deg,#67e8f9,#0891b2)',v=>v>=1000?(v/1000).toFixed(1)+'k':v)}</div></div>`;
 // dept table
 h+=`<div class="card" style="margin-top:14px"><h3>Department summary <small>${fmtD(d)}</small></h3><div class="tbl"><table><tr><th>Department</th><th class="n">Sections</th><th class="n">Students</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th>Attendance</th><th class="n">Offering</th><th class="n">Teachers</th></tr>
 ${a.depts.map(x=>{const p=pct(x.P,x.P+x.A+x.L),tt=tStat(d,x.d.id);return `<tr><td><i class="dot" style="color:${x.d.color}"></i> <b>${esc(x.d.name)}</b></td><td class="n">${x.d.secs.length}</td><td class="n">${x.T}</td><td class="n ok">${x.P}</td><td class="n bad">${x.A}</td><td class="n lvc">${x.L}</td><td><div style="display:flex;gap:8px;align-items:center">${miniBar(p)}<b class="${pctCls(p)}">${p}%</b></div></td><td class="n">${money(x.off)}</td><td class="n">${tt.P}/${tt.T}</td></tr>`}).join('')}
 <tr class="tot"><td>Total</td><td class="n">${a.depts.reduce((s,x)=>s+x.d.secs.length,0)}</td><td class="n">${a.T}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td>${pct(a.P,a.M)}%</td><td class="n">${money(a.off)}</td><td class="n">${t.P}/${t.T}</td></tr></table></div></div>`;
 // pending
 const pend=[];a.depts.forEach(x=>x.secs.forEach(s=>{if(s.T&&!s.taken)pend.push({d:x.d,c:s.c,T:s.T})}));
 const best=a.depts.filter(x=>x.P+x.A+x.L).map(x=>({n:x.d.name,p:pct(x.P,x.P+x.A+x.L)})).sort((p,q)=>q.p-p.p);
 h+=`<div class="g2" style="margin-top:14px"><div class="card"><h3>Roll call pending <small>${pend.length} section(s)</small></h3>${S.hol[d]?'<div class="muted">No class this Sunday.</div>':pend.length?`<div class="chips">${pend.map(p=>`<button class="chip" onclick="openRoll('${p.d.id}','${p.c.id}')"><i class="dot" style="color:${p.d.color}"></i>${esc(p.d.name)} ${esc(p.c.name)} <span class="muted" style="font-weight:500">(${p.T})</span></button>`).join('')}</div>`:'<div class="ok"><b>✓ All sections with students are marked.</b></div>'}</div>
 <div class="card"><h3>Highlights</h3><div class="lst">
 <div><span class="muted">Best department today</span><b>${best[0]?esc(best[0].n)+' · '+best[0].p+'%':'—'}</b></div>
 <div><span class="muted">Needs attention</span><b>${best.length>1?esc(best[best.length-1].n)+' · '+best[best.length-1].p+'%':'—'}</b></div>
 <div><span class="muted">Sundays held this session</span><b>${held.length} of ${sundays().length}</b></div>
 <div><span class="muted">Average attendance (session)</span><b>${avg}%</b></div>
 <div><span class="muted">Total offering (session)</span><b>${money(sessOff)}</b></div>
 <div><span class="muted">Total teachers</span><b>${teachersIn(f).length}</b></div></div></div></div>`;
 return h;
}
function openRoll(did,cid){U.rDeptSel=did;U.rSecSel=cid;go('rollcall')}

/* ============ ROLL CALL ============ */
function vRoll(){
 if(!S.depts.length)return topbar('Roll Call')+emptyBox('No departments yet','Add departments in Setup first.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 let d=deptOf(U.rDeptSel)||S.depts[0];U.rDeptSel=d.id;
 if(!d.secs.find(c=>c.id===U.rSecSel))U.rSecSel=d.secs[0]?.id;
 const cid=U.rSecSel,date=U.date;
 const ctl=`<div class="ctl"><select onchange="setU('date',this.value)">${dateOpts(date)}</select></div>`;
 let h=topbar('Sunday Roll Call',fmtD(date)+' · one roll call per Sunday morning',ctl);
 h+=`<div class="card"><div class="chips" style="margin-bottom:10px">${S.depts.map(x=>`<button class="chip ${x.id===d.id?'on':''}" onclick="U.rDeptSel='${x.id}';U.rSecSel=null;rerender()"><i class="dot" style="color:${x.id===d.id?'#fff':x.color}"></i>${esc(x.name)}</button>`).join('')}</div>
 <div class="chips">${d.secs.map(c=>{const s=secStat(date,c.id);return `<button class="chip ${c.id===cid?'on':''}" onclick="setU('rSecSel','${c.id}')">Section ${esc(c.name)} <span class="muted" style="font-weight:500;${c.id===cid?'color:#c7d2fe':''}">${s.T}</span>${s.taken?'<span class="ck">✓</span>':''}</button>`}).join('')||'<span class="muted">No sections. Add sections in Setup.</span>'}</div></div>`;
 if(S.hol[date])return h+`<div class="banner o" style="margin-top:14px">${svg('cal')}<b>No Sunday School this day:</b> ${esc(S.hol[date])}<span class="sp"></span><button class="btn sm" onclick="unHoliday()">Undo – class was held</button></div>`;
 if(!cid)return h;
 const st=studentsOf(cid);
 if(!st.length)return h+`<div style="margin-top:14px">${emptyBox('No students in '+esc(d.name)+' – Section '+esc(secInfo(cid).c.name),'Add students (one by one or paste a whole list).',`<button class="btn pri" onclick="U.sDept='${d.id}';U.sSec='${cid}';go('students')">Add students</button>`)}</div>`;
 const m=(S.att[date]||{})[cid]||{};const off=((S.off[date]||{})[cid])??'';
 h+=`<div class="card" style="margin-top:14px;position:sticky;top:0;z-index:5"><div class="rsum" id="rsum"></div>
 <div class="ctl" style="margin-top:10px"><div class="fld" style="flex:1;min-width:150px"><label>Offering collected (${esc(S.settings.cur)})</label><input type="number" inputmode="decimal" min="0" step="any" value="${off}" placeholder="0" onchange="setOff('${cid}',this.value)"></div>
 <div class="ctl" style="align-self:flex-end"><button class="btn ok" onclick="markRest('${cid}')">${svg('check',16)} Rest Present</button><button class="btn" onclick="clearSec('${cid}')">Clear</button><button class="btn" onclick="setHoliday()">No class</button></div></div>
 <input type="search" placeholder="Search name or roll…" style="width:100%;margin-top:10px" oninput="filterRoll(this.value)"></div>`;
 h+=`<div class="card" style="margin-top:10px;padding:6px 10px" id="rlist">${st.map(s=>{const v=m[s.id]||'';return `<div class="srow ${v?'m'+v:''}" data-id="${s.id}" data-k="${esc((s.roll+' '+s.name).toLowerCase())}"><div class="roll">${s.roll}</div><div class="nm"><b>${esc(s.name)}</b><small>${s.g==='F'?'Girl':s.g==='M'?'Boy':''}${s.guardian?' · '+esc(s.guardian):''}</small></div><div class="seg">${['P','A','L'].map(k=>`<button class="${k} ${v===k?'on':''}" onclick="mark('${cid}','${s.id}','${k}')">${k}</button>`).join('')}</div></div>`}).join('')}</div>`;
 const all=d.secs,ix=all.findIndex(c=>c.id===cid);const nx=all[ix+1];const nd=S.depts[S.depts.indexOf(d)+1];
 h+=`<div class="ctl" style="margin-top:12px;justify-content:flex-end">${nx?`<button class="btn pri" onclick="setU('rSecSel','${nx.id}')">Next: Section ${esc(nx.name)} →</button>`:nd?`<button class="btn pri" onclick="U.rDeptSel='${nd.id}';U.rSecSel=null;rerender()">Next: ${esc(nd.name)} →</button>`:`<button class="btn pri" onclick="go('dashboard')">Finish → Dashboard</button>`}</div>`;
 setTimeout(updSum,0);return h;
}
function updSum(){const e=$('#rsum');if(!e)return;const s=secStat(U.date,U.rSecSel);e.innerHTML=`<div><b>${s.T}</b><span>Total</span></div><div class="p"><b>${s.P}</b><span>Present</span></div><div class="a"><b>${s.A}</b><span>Absent</span></div><div class="lv"><b>${s.L}</b><span>Leave</span></div><div><b>${s.U}</b><span>Unmarked</span></div>`}
function attMap(date,cid){S.att[date]=S.att[date]||{};return S.att[date][cid]=S.att[date][cid]||{}}
function cleanAtt(date,cid){const a=S.att[date];if(!a)return;if(a[cid]&&!Object.keys(a[cid]).length)delete a[cid];if(!Object.keys(a).length)delete S.att[date]}
function mark(cid,sid,v){const m=attMap(U.date,cid);if(m[sid]===v)delete m[sid];else m[sid]=v;cleanAtt(U.date,cid);save();
 const r=document.querySelector(`.srow[data-id="${sid}"]`);if(r){const nv=m[sid]||'';r.className='srow'+(nv?' m'+nv:'');r.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent===nv))}updSum()}
function markRest(cid){const m=attMap(U.date,cid);studentsOf(cid).forEach(s=>{if(!m[s.id])m[s.id]='P'});save();rerender();toast('Remaining students marked Present')}
async function clearSec(cid){if(!await ask('Clear all marks for this section on '+fmtD(U.date)+'?','Clear',true))return;if(S.att[U.date])delete S.att[U.date][cid];cleanAtt(U.date,cid);save();rerender()}
function setOff(cid,v){S.off[U.date]=S.off[U.date]||{};const n=parseFloat(v);if(isNaN(n)||n<=0)delete S.off[U.date][cid];else S.off[U.date][cid]=n;if(!Object.keys(S.off[U.date]).length)delete S.off[U.date];save();toast('Offering saved')}
function setHoliday(){modal('No Sunday School this day',`<p>Mark <b>${fmtD(U.date)}</b> as a day with no class. It will be left out of all reports.</p><div class="fld"><label>Reason</label><input type="text" name="r" placeholder="e.g. Christmas, Church programme, Heavy rain"></div>`,[{t:'Cancel'},{t:'Mark as No Class',cls:'pri',fn:w=>{S.hol[U.date]=val(w,'r')||'No class';save();rerender()}}])}
function unHoliday(){delete S.hol[U.date];save();rerender()}
function filterRoll(q){q=q.toLowerCase().trim();document.querySelectorAll('#rlist .srow').forEach(r=>r.style.display=!q||r.dataset.k.includes(q)?'':'none')}

/* ============ TEACHERS ============ */
function vTeach(){
 let h=topbar('Teachers',S.teachers.length+' teachers · attendance & list',`<div class="ctl"><button class="btn pri" onclick="editTeacher()">${svg('plus',16)} Add Teacher</button></div>`);
 h+=`<div class="tabs"><button class="${U.tTab==='att'?'on':''}" onclick="setU('tTab','att')">Sunday Attendance</button><button class="${U.tTab==='list'?'on':''}" onclick="setU('tTab','list')">Teacher List</button></div>`;
 if(!S.teachers.length)return h+emptyBox('No teachers added','Add your Sunday School teachers, superintendent and office bearers.',`<button class="btn pri" onclick="editTeacher()">Add Teacher</button> <button class="btn" onclick="bulkTeachers()">Paste a list</button>`);
 const groups=[...S.depts.map(d=>({id:d.id,name:d.name,color:d.color})),{id:'',name:'General / Office bearers',color:'#64748b'}];
 if(U.tTab==='list'){
  return h+`<div class="ctl" style="margin-bottom:10px"><button class="btn" onclick="bulkTeachers()">Paste a list</button></div><div class="card" style="padding:0"><div class="tbl" style="border:0"><table><tr><th>#</th><th>Name</th><th>Role</th><th>Department</th><th>Section</th><th>Phone</th><th class="c">Actions</th></tr>${S.teachers.map((t,i)=>`<tr><td>${i+1}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.role||'')}</td><td>${t.dept?'<i class="dot" style="color:'+(deptOf(t.dept)?.color||'#999')+'"></i> '+esc(deptOf(t.dept)?.name||''):'<span class="muted">General</span>'}</td><td>${t.sec?esc(secInfo(t.sec)?.c.name||''):''}</td><td>${esc(t.phone||'')}</td><td class="c"><button class="btn sm ghost" onclick="editTeacher('${t.id}')">${svg('edit',15)}</button><button class="btn sm ghost" onclick="delTeacher('${t.id}')">${svg('trash',15)}</button></td></tr>`).join('')}</table></div></div>`;
 }
 const date=U.date,ts=tStat(date),m=S.tatt[date]||{};
 h+=`<div class="ctl" style="margin-bottom:12px"><select onchange="setU('date',this.value)">${dateOpts(date)}</select><button class="btn ok" onclick="tRest()">${svg('check',16)} Rest Present</button></div>`;
 h+=`<div class="kpis" style="margin-bottom:14px">${kpi('Teachers',ts.T,'','#4f46e5','#eef2ff','teach')}${kpi('Present',ts.P,pct(ts.P,ts.T)+'%','#16a34a','#dcfce7','check')}${kpi('Absent',ts.A,'','#dc2626','#fee2e2','x')}${kpi('Leave',ts.L,ts.U?ts.U+' not marked':'All marked','#d97706','#fef3c7','leave')}</div>`;
 groups.forEach(g=>{const list=S.teachers.filter(t=>(t.dept||'')===g.id);if(!list.length)return;
  h+=`<div class="card" style="margin-bottom:10px;padding:10px 12px"><h3 style="margin-bottom:4px"><i class="dot" style="color:${g.color}"></i> ${esc(g.name)} <small>${list.length}</small></h3>${list.map(t=>{const v=m[t.id]||'';return `<div class="srow ${v?'m'+v:''}" data-t="${t.id}"><div class="roll">${esc((t.name||'?')[0])}</div><div class="nm"><b>${esc(t.name)}</b><small>${esc(t.role||'')}${t.sec?' · Section '+esc(secInfo(t.sec)?.c.name||''):''}</small></div><div class="seg">${['P','A','L'].map(k=>`<button class="${k} ${v===k?'on':''}" onclick="tMark('${t.id}','${k}')">${k}</button>`).join('')}</div></div>`}).join('')}</div>`});
 return h;
}
function tMark(id,v){const m=S.tatt[U.date]=S.tatt[U.date]||{};if(m[id]===v)delete m[id];else m[id]=v;if(!Object.keys(m).length)delete S.tatt[U.date];save();rerender()}
function tRest(){const m=S.tatt[U.date]=S.tatt[U.date]||{};S.teachers.forEach(t=>{if(!m[t.id])m[t.id]='P'});save();rerender()}
function secOptsAll(sel,blank){return (blank?`<option value="">— None —</option>`:'')+S.depts.map(d=>`<optgroup label="${esc(d.name)}">${d.secs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(d.name)} – Section ${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}
function editTeacher(id){const t=S.teachers.find(x=>x.id===id)||{};
 modal(id?'Edit Teacher':'Add Teacher',`<div class="form"><div class="fld full"><label>Name *</label><input type="text" name="name" value="${esc(t.name||'')}"></div>
 <div class="fld"><label>Role</label><select name="role">${ROLES.map(r=>`<option ${r===(t.role||'Teacher')?'selected':''}>${r}</option>`).join('')}</select></div>
 <div class="fld"><label>Phone</label><input type="tel" name="phone" value="${esc(t.phone||'')}"></div>
 <div class="fld full"><label>Class taught (Department – Section)</label><select name="sec"><option value="">General / Office bearer (no class)</option>${secOptsAll(t.sec)}</select></div></div>`,
 [{t:'Cancel'},{t:id?'Save':'Add Teacher',cls:'pri',fn:w=>{const name=val(w,'name');if(!name){toast('Please enter a name');return false}const sec=val(w,'sec');
  const o={name,role:val(w,'role'),phone:val(w,'phone'),sec,dept:sec?secInfo(sec).d.id:''};
  if(id)Object.assign(t,o);else S.teachers.push(Object.assign({id:newId('t')},o));save();rerender();toast(id?'Teacher updated':'Teacher added')}}])}
async function delTeacher(id){const t=S.teachers.find(x=>x.id===id);if(!await ask(`Delete teacher <b>${esc(t.name)}</b>? Their attendance history will also be removed.`,'Delete',true))return;S.teachers=S.teachers.filter(x=>x.id!==id);for(const d in S.tatt){delete S.tatt[d][id]}save();rerender()}
function bulkTeachers(){modal('Paste teacher list',`<p class="muted">One teacher per line: <b>Name, Role, Phone</b> (only name is required). You can copy columns straight from Excel.</p><div class="fld"><label>Assign all to class (optional)</label><select name="sec"><option value="">General / no class</option>${secOptsAll('')}</select></div><textarea name="list" style="width:100%;height:200px;margin-top:10px" placeholder="Lalramenga, Teacher, 9876543210"></textarea>`,
 [{t:'Cancel'},{t:'Add All',cls:'pri',fn:w=>{const sec=val(w,'sec');let n=0;val(w,'list').split(/\r?\n/).forEach(line=>{const p=line.split(/\t|,/).map(x=>x.trim());if(!p[0])return;S.teachers.push({id:newId('t'),name:p[0],role:ROLES.find(r=>r.toLowerCase()===(p[1]||'').toLowerCase())||p[1]||'Teacher',phone:p[2]||'',sec,dept:sec?secInfo(sec).d.id:''});n++});save();rerender();toast(n+' teachers added')}}])}

/* ============ STUDENTS ============ */
function vStud(){
 if(!S.depts.length)return topbar('Students')+emptyBox('No departments yet','Add departments in Setup first.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 let d=deptOf(U.sDept)||S.depts[0];U.sDept=d.id;if(!d.secs.find(c=>c.id===U.sSec))U.sSec=d.secs[0]?.id;const cid=U.sSec;
 let h=topbar('Students',num(S.students.length)+' students enrolled · '+S.depts.reduce((s,x)=>s+x.secs.length,0)+' sections',`<input type="search" placeholder="Search all students…" value="${esc(U.search)}" oninput="U.search=this.value;clearTimeout(window._st);window._st=setTimeout(()=>{rerender();const i=document.querySelector('.top input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)">`);
 if(U.search.trim()){const q=U.search.toLowerCase().trim();const r=S.students.filter(s=>s.name.toLowerCase().includes(q)||(s.guardian||'').toLowerCase().includes(q)||(s.phone||'').includes(q)).slice(0,200);
  return h+`<div class="card" style="padding:0"><div class="tbl" style="border:0"><table><tr><th>Name</th><th>Class</th><th class="n">Roll</th><th>Guardian</th><th>Phone</th><th class="c">Edit</th></tr>${r.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(secLabel(s.sec))}</td><td class="n">${s.roll}</td><td>${esc(s.guardian||'')}</td><td>${esc(s.phone||'')}</td><td class="c"><button class="btn sm ghost" onclick="editStudent('${s.id}')">${svg('edit',15)}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No match</td></tr>'}</table></div></div>`}
 h+=`<div class="card"><div class="chips" style="margin-bottom:10px">${S.depts.map(x=>`<button class="chip ${x.id===d.id?'on':''}" onclick="U.sDept='${x.id}';U.sSec=null;rerender()"><i class="dot" style="color:${x.id===d.id?'#fff':x.color}"></i>${esc(x.name)} <span style="font-weight:500;opacity:.7">${x.secs.reduce((s,c)=>s+studentsOf(c.id).length,0)}</span></button>`).join('')}</div>
 <div class="chips">${d.secs.map(c=>`<button class="chip ${c.id===cid?'on':''}" onclick="setU('sSec','${c.id}')">Section ${esc(c.name)} <span style="font-weight:500;opacity:.7">${studentsOf(c.id).length}</span></button>`).join('')}</div></div>`;
 if(!cid)return h+`<div style="margin-top:14px">${emptyBox('No sections','Add sections to this department in Setup.')}</div>`;
 const st=studentsOf(cid),cap=+S.settings.cap||60,fill=Math.min(st.length/cap*100,100);
 const teachers=S.teachers.filter(t=>t.sec===cid).map(t=>esc(t.name)).join(', ');
 h+=`<div class="card" style="margin-top:14px"><div class="ctl" style="margin-bottom:12px"><div><b style="font-size:16px">${esc(d.name)} – Section ${esc(secInfo(cid).c.name)}</b><div class="muted" style="font-size:12px">Teacher: ${teachers||'not assigned'}</div></div><span class="sp"></span>
 <div class="ctl"><div class="capbar"><i style="width:${fill}%;background:${st.length>cap?'#dc2626':'#4f46e5'}"></i></div><b>${st.length}/${cap}</b></div></div>
 <div class="ctl noprint" style="margin-bottom:12px"><button class="btn pri" onclick="editStudent()">${svg('plus',16)} Add Student</button><button class="btn" onclick="bulkStudents()">Paste a list</button><button class="btn" onclick="renumber('${cid}')">Re-number rolls A–Z</button><button class="btn" onclick="exportStudents('${cid}')">${svg('dl',16)} CSV</button></div>
 ${st.length?`<div class="tbl"><table><tr><th class="n">Roll</th><th>Name</th><th>Gender</th><th>Guardian</th><th>Phone</th><th class="n">Attendance</th><th class="c">Actions</th></tr>${st.map(s=>{const r=stuRange(s,heldDates());const p=pct(r.P,r.M);return `<tr><td class="n"><b>${s.roll}</b></td><td><b>${esc(s.name)}</b></td><td>${s.g==='F'?'Girl':s.g==='M'?'Boy':''}</td><td>${esc(s.guardian||'')}</td><td>${esc(s.phone||'')}</td><td class="n">${r.M?`<b class="${pctCls(p)}">${p}%</b> <span class="muted">(${r.P}/${r.M})</span>`:'<span class="muted">—</span>'}</td><td class="c"><button class="btn sm ghost" title="Edit / move" onclick="editStudent('${s.id}')">${svg('edit',15)}</button><button class="btn sm ghost" title="Delete" onclick="delStudent('${s.id}')">${svg('trash',15)}</button></td></tr>`}).join('')}</table></div>`:`<div class="empty">No students yet. Use <b>Add Student</b> or <b>Paste a list</b> to add up to ${cap} students.</div>`}</div>`;
 return h;
}
function stuRange(s,dates){const o={P:0,A:0,L:0};dates.forEach(d=>{const v=((S.att[d]||{})[s.sec]||{})[s.id];if(v)o[v]++});o.M=o.P+o.A+o.L;return o}
function nextRoll(cid){return studentsOf(cid).reduce((m,s)=>Math.max(m,+s.roll||0),0)+1}
function editStudent(id){const s=S.students.find(x=>x.id===id)||{sec:U.sSec,roll:nextRoll(U.sSec),g:''};
 modal(id?'Edit Student':'Add Student',`<div class="form"><div class="fld full"><label>Full name *</label><input type="text" name="name" value="${esc(s.name||'')}"></div>
 <div class="fld"><label>Roll No.</label><input type="number" name="roll" min="1" value="${s.roll}"></div>
 <div class="fld"><label>Gender</label><select name="g"><option value="">—</option><option value="M" ${s.g==='M'?'selected':''}>Boy</option><option value="F" ${s.g==='F'?'selected':''}>Girl</option></select></div>
 <div class="fld"><label>Parent / Guardian</label><input type="text" name="guardian" value="${esc(s.guardian||'')}"></div>
 <div class="fld"><label>Phone</label><input type="tel" name="phone" value="${esc(s.phone||'')}"></div>
 <div class="fld full"><label>Department – Section ${id?'(change to move student)':''}</label><select name="sec">${secOptsAll(s.sec)}</select></div></div>`,
 [{t:'Cancel'},...(id?[]:[{t:'Save & Add Next',fn:w=>{if(saveStu(w,null)){const f=w.querySelector('[name=name]');f.value='';w.querySelector('[name=roll]').value=nextRoll(val(w,'sec'));w.querySelector('[name=guardian]').value='';w.querySelector('[name=phone]').value='';f.focus();toast('Student added');rerender()}return false}}]),{t:id?'Save':'Add Student',cls:'pri',fn:w=>{if(!saveStu(w,id))return false;rerender();toast(id?'Student updated':'Student added')}}])}
function saveStu(w,id){const name=val(w,'name');if(!name){toast('Please enter the student name');return false}const sec=val(w,'sec');
 const o={name,roll:parseInt(val(w,'roll'))||nextRoll(sec),g:val(w,'g'),guardian:val(w,'guardian'),phone:val(w,'phone'),sec};
 if(!id&&studentsOf(sec).length>=(+S.settings.cap||60))toast('Note: section now has more than '+S.settings.cap+' students');
 if(id){const s=S.students.find(x=>x.id===id);if(s.sec!==sec){for(const d in S.att){const a=S.att[d][s.sec];if(a&&a[id]){attMapD(d,sec)[id]=a[id];delete a[id]}}}Object.assign(s,o)}else S.students.push(Object.assign({id:newId('s')},o));
 save();return true}
function attMapD(d,cid){S.att[d]=S.att[d]||{};return S.att[d][cid]=S.att[d][cid]||{}}
async function delStudent(id){const s=S.students.find(x=>x.id===id);if(!await ask(`Delete <b>${esc(s.name)}</b> from the register? Their attendance history will also be removed.`,'Delete',true))return;S.students=S.students.filter(x=>x.id!==id);for(const d in S.att){const a=S.att[d][s.sec];if(a){delete a[id];cleanAtt(d,s.sec)}}save();rerender()}
function bulkStudents(){const cid=U.sSec;modal('Paste student list – '+esc(secLabel(cid)),`<p class="muted">One student per line: <b>Name, Gender (M/F), Guardian, Phone</b>. Only the name is required. You can copy columns straight from Excel. Roll numbers continue from ${nextRoll(cid)}.</p><textarea name="list" style="width:100%;height:240px" placeholder="Lalrinpuii, F, Lalthanga, 9876543210&#10;Joseph, M&#10;Esther"></textarea>`,
 [{t:'Cancel'},{t:'Add All',cls:'pri',fn:w=>{let r=nextRoll(cid),n=0;val(w,'list').split(/\r?\n/).forEach(line=>{const p=line.split(/\t|,/).map(x=>x.trim());if(!p[0])return;let g=(p[1]||'').toUpperCase();g=g.startsWith('F')||g.startsWith('G')?'F':g.startsWith('M')||g.startsWith('B')?'M':'';S.students.push({id:newId('s'),name:p[0],g,guardian:p[2]||'',phone:p[3]||'',roll:r++,sec:cid});n++});save();rerender();toast(n+' students added')}}])}
async function renumber(cid){if(!await ask('Re-number roll numbers 1, 2, 3… in alphabetical order of names for this section?','Re-number'))return;studentsOf(cid).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach((s,i)=>s.roll=i+1);save();rerender();toast('Roll numbers updated')}
function exportStudents(cid){const rows=[['Roll','Name','Gender','Guardian','Phone','Department','Section']];const i=secInfo(cid);studentsOf(cid).forEach(s=>rows.push([s.roll,s.name,s.g,s.guardian||'',s.phone||'',i.d.name,i.c.name]));download(`Students_${i.d.name}_${i.c.name}.csv`,'﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}

/* ============ REPORTS ============ */
function vRep(){
 const tabs=[['weekly','Weekly'],['monthly','Monthly'],['annual','Annual'],['register','Roll Register'],['students','Student %'],['teachers','Teachers'],['offering','Offering']];

  <div class="card"><h3>${svg('dash',18)} Data on this device</h3><div class="lst"><div><span class="muted">Departments / Sections</span><b>${S.depts.length} / ${S.depts.reduce((s,d)=>s+d.secs.length,0)}</b></div><div><span class="muted">Students</span><b>${num(S.students.length)}</b></div><div><span class="muted">Teachers</span><b>${S.teachers.length}</b></div><div><span class="muted">Sundays recorded</span><b>${heldDates().length}</b></div><div><span class="muted">Data size</span><b>${(bytes/1024).toFixed(0)} KB</b></div></div>

  <div class="card" style="margin-top:14px"><h3>Install as an app</h3><p class="muted" style="margin:0">Phone (Chrome): open the menu ⋮ → <b>Add to Home screen / Install app</b>. PC (Chrome/Edge): click the install icon in the address bar. After the first open it runs fully offline.</p></div>`;
 }
 return h;
}
function addDept(){modal('Add Department',`<div class="form"><div class="fld full"><label>Department name *</label><input type="text" name="name" placeholder="e.g. Cradle Roll, Youth"></div><div class="fld"><label>Number of sections</label><input type="number" name="n" value="5" min="1" max="26"></div><div class="fld"><label>Colour</label><select name="c">${COLORS.map((c,i)=>`<option value="${c}" style="color:${c}" ${i===S.depts.length%COLORS.length?'selected':''}>■ Colour ${i+1}</option>`).join('')}</select></div></div>`,
 [{t:'Cancel'},{t:'Add Department',cls:'pri',fn:w=>{const name=val(w,'name');if(!name){toast('Enter a name');return false}const n=Math.min(Math.max(parseInt(val(w,'n'))||1,1),26);S.depts.push({id:newId('d'),name,color:val(w,'c'),secs:Array.from({length:n},(_,i)=>({id:newId('c'),name:String.fromCharCode(65+i)}))});save();rerender();toast('Department added')}}])}
function editDept(id){const d=deptOf(id);modal('Edit Department',`<div class="form"><div class="fld full"><label>Name</label><input type="text" name="name" value="${esc(d.name)}"></div><div class="fld"><label>Colour</label><select name="c">${COLORS.map((c,i)=>`<option value="${c}" ${c===d.color?'selected':''}>■ Colour ${i+1}</option>`).join('')}</select></div></div>`,[{t:'Cancel'},{t:'Save',cls:'pri',fn:w=>{d.name=val(w,'name')||d.name;d.color=val(w,'c');save();rerender()}}])}
function moveDept(i,dir){const a=S.depts;[a[i],a[i+dir]]=[a[i+dir],a[i]];save();rerender()}
function purgeSec(cid){const ids=new Set(studentsOf(cid).map(s=>s.id));S.students=S.students.filter(s=>s.sec!==cid);for(const d in S.att){delete S.att[d][cid];cleanAtt(d,cid)}for(const d in S.off){delete S.off[d][cid];if(!Object.keys(S.off[d]).length)delete S.off[d]}S.teachers.forEach(t=>{if(t.sec===cid)t.sec=''})}
async function delDept(id){const d=deptOf(id);const n=d.secs.reduce((s,c)=>s+studentsOf(c.id).length,0);if(!await ask(`Delete department <b>${esc(d.name)}</b> with ${d.secs.length} sections and <b>${n} students</b>? All its attendance and offering records will be removed. Consider downloading a backup first.`,'Delete department',true))return;d.secs.forEach(c=>purgeSec(c.id));S.teachers.forEach(t=>{if(t.dept===id){t.dept='';t.sec=''}});S.depts=S.depts.filter(x=>x.id!==id);save();rerender();toast('Department deleted')}
function addSec(did){const d=deptOf(did);const used=new Set(d.secs.map(c=>c.name));let nm='';for(let i=0;i<26;i++){const l=String.fromCharCode(65+i);if(!used.has(l)){nm=l;break}}d.secs.push({id:newId('c'),name:nm||String(d.secs.length+1)});save();rerender();toast('Section '+(nm||'')+' added')}
function renSec(did,cid){const c=deptOf(did).secs.find(x=>x.id===cid);modal('Rename Section',`<div class="fld"><label>Section name</label><input type="text" name="n" value="${esc(c.name)}"></div>`,[{t:'Cancel'},{t:'Save',cls:'pri',fn:w=>{c.name=val(w,'n')||c.name;save();rerender()}}])}
async function delSec(did,cid){const d=deptOf(did),c=d.secs.find(x=>x.id===cid),n=studentsOf(cid).length;if(!await ask(`Delete <b>${esc(d.name)} – Section ${esc(c.name)}</b>${n?` and its <b>${n} students</b> with their attendance`:''}?`,'Delete section',true))return;purgeSec(cid);d.secs=d.secs.filter(x=>x.id!==cid);save();rerender()}
function saveSettings(){const g=id=>document.getElementById(id).value.trim();const st=g('st_start'),en=g('st_end');if(!st||!en||st>=en){toast('Session end must be after start');return}
 Object.assign(S.settings,{org:g('st_org')||'Sunday School',sub:g('st_sub'),place:g('st_place'),session:g('st_session'),cur:g('st_cur')||'₹',start:st,end:en,cap:Math.max(1,parseInt(g('st_cap'))||60),low:Math.min(100,Math.max(1,parseInt(g('st_low'))||75)),supt:g('st_supt'),secy:g('st_secy')});U.date=null;save();render();toast('Settings saved')}
function backup(){S.lastBackup=Date.now();save();download(`SJS_SundaySchool_Backup_${iso(new Date())}.json`,JSON.stringify(S),'application/json')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.depts)||!Array.isArray(d.students))throw 0;if(!await ask(`Replace all current data with this backup?<br><small class="muted">${d.depts.length} departments · ${d.students.length} students · ${(d.teachers||[]).length} teachers</small>`,'Restore'))return;S=Object.assign(defStateEmpty(),d);S.settings=Object.assign(defSettings(),d.settings||{});U.date=null;save();render();toast('Backup restored')}catch(e){toast('This is not a valid backup file')}};r.readAsText(f);inp.value=''}
function defStateEmpty(){return{v:1,seq:1,settings:{},depts:[],students:[],teachers:[],att:{},tatt:{},off:{},hol:{}}}
async function resetAll(){if(!await ask('Erase <b>all</b> departments, students, teachers and attendance on this device? This cannot be undone unless you have a backup.','Erase everything',true))return;defState();save();render();toast('All data erased. Default departments created.')}
async function loadSample(){if((S.students.length||S.teachers.length)&&!await ask('Loading sample data will <b>replace</b> your current data. Continue?','Load sample',true))return;
 defState();const B=['Lalramenga','Joseph','Daniel','Samuel','David','John','Peter','Isaac','Lalthanzuala','Zorinsanga','Biaksiama','Vanlalruata','Lalrinfela','Malsawma','Lalnunsanga','Remruata','Michael','Stephen','Thangliana','Benjamin'],G=['Mary','Esther','Ruth','Grace','Lalremruati','Zothanpuii','Lalhmingliani','Rebecca','Hannah','Sarah','Lalrinpuii','Mercy','Faith','Joyce','Lydia','Martha','Naomi','Zonunmawii','Rosy','Vanlalhriati'],P=['Lalthanga','Ramdinsanga','Zoramthanga','Lalbiakzuala','Hmingthanmawia','Lalchhuanawma','Rokunga','Thangzuala'];
 const rnd=a=>a[Math.floor(Math.random()*a.length)];
 S.depts.forEach((d,di)=>d.secs.forEach(c=>{const n=40+Math.floor(Math.random()*21);for(let i=0;i<n;i++){const g=Math.random()<.5?'M':'F';S.students.push({id:newId('s'),name:rnd(g==='M'?B:G)+(i>19?' '+String.fromCharCode(65+i%26)+'.':''),g,guardian:rnd(P),phone:'',roll:i+1,sec:c.id})}
  S.teachers.push({id:newId('t'),name:rnd(Math.random()<.5?B:G)+' (T)',role:'Teacher',phone:'',sec:c.id,dept:d.id})}));
 S.teachers.unshift({id:newId('t'),name:'Superintendent',role:'Superintendent',phone:'',sec:'',dept:''},{id:newId('t'),name:'Secretary',role:'Secretary',phone:'',sec:'',dept:''});
 _idx=null;const today=iso(new Date());const su=sundays().filter(x=>x<=today);const xmas=su.find(x=>x.slice(5,7)==='12'&&+x.slice(8)>=22);
 su.forEach(dt=>{if(dt===xmas){S.hol[dt]='Christmas programme';return}const base=.72+Math.random()*.18;S.depts.forEach(d=>d.secs.forEach(c=>{const m=attMapD(dt,c.id);studentsOf(c.id).forEach(s=>{const r=Math.random();m[s.id]=r<base?'P':r<base+.06?'L':'A'});S.off[dt]=S.off[dt]||{};S.off[dt][c.id]=Math.round((80+Math.random()*220)/10)*10}));
  const tm=S.tatt[dt]={};S.teachers.forEach(t=>{const r=Math.random();tm[t.id]=r<.88?'P':r<.94?'L':'A'})});
 save();U.date=null;go('dashboard');render();toast('Sample data loaded – erase it in Setup before real use')}

function netPill(){const e=$('#netState');if(e)e.innerHTML=navigator.onLine?'<span style="color:#86efac">●</span> Online':'<span style="color:#fcd34d">●</span> Offline mode – data still saves'}
(async function boot(){
 $('#logoIc').innerHTML=svg('cross',22);
 await Store.open();
 const d=await Store.get();
 if(d&&Array.isArray(d.depts)){S=Object.assign(defStateEmpty(),d);S.settings=Object.assign(defSettings(),d.settings||{});if(S.settings.end==='2027-02-28')S.settings.end='2027-04-30';S=Object.assign(S,{depts:d.depts,students:d.students,teachers:d.teachers||[],att:d.att||{},tatt:d.tatt||{},off:d.off||{},hol:d.hol||{},seq:d.seq||1000,lastBackup:d.lastBackup||null})}
 else{defState();save()}
 setSaved(true);netPill();window.addEventListener('online',netPill);window.addEventListener('offline',netPill);
 window.addEventListener('hashchange',render);render();
 try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){fetch('sw.js',{method:'HEAD'}).then(r=>{if(r.ok){navigator.serviceWorker.register('sw.js').catch(()=>{});const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l)}}).catch(()=>{})}}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
