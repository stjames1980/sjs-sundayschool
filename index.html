 let b=`<div class="tbl"><table data-title="Result summary"><tr><th>Department</th><th>Section</th><th class="n">Students</th><th class="n">Appeared</th><th class="n">Honours</th><th class="n">Pass</th><th class="n">Fail</th><th class="n">Absent</th><th class="n">Not entered</th><th class="n">Pass %</th><th class="n">Average</th><th class="n">Highest</th></tr>`;
 S.depts.forEach(d=>{if(f!=='all'&&d.id!==f)return;d.secs.forEach((c,i)=>{b+=row(i?'':'<b>'+esc(d.name)+'</b>',esc(c.name),examStats(e,d.id,c.id),'')});b+=row(esc(d.name)+' total','',examStats(e,d.id),'sub')});
 b+=row('GRAND TOTAL','',s,'tot')+'</table></div><p class="muted" style="font-size:11.5px">Pass % = students with '+e.pm+'+ marks (Honours included) out of students who appeared.</p>';
 return h+repBox('Result Summary',`${examLine(e)} · ${f==='all'?'All departments':esc(deptOf(f)?.name||'')}`,b)}

function xSheet(e){const d=xPick(),cid=U.xSec,ar=U.xAtt||'session';
 let h=`<div class="card noprint" style="margin-bottom:12px"><div class="ctl"><select onchange="U.xDept=this.value;U.xSec=null;rerender()">${deptOpts(d.id)}</select><select onchange="setU('xSec',this.value)">${d.secs.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${secNm(c.name)}</option>`).join('')}</select><label class="muted" style="font-size:12.5px">Attendance:</label><select onchange="setU('xAtt',this.value)">${monthOpts(ar,true)}</select>${pxBtns('Result_Sheet')}</div></div>`;
 if(!cid)return h;
 const x=examStats(e,'all',cid),rmap={};rankRows(x.rows).forEach(r=>rmap[r.s.id]=r.rank);
 const dates=rangeDates(ar).filter(dt=>secStat(dt,cid).taken),teacher=secTeachers(cid);let aSum=0,aN=0;
 const rows=studentsOf(cid).map(s=>{const v=markOf(e.id,cid,s.id),t=resStatus(v,e),a=stuRange(s,dates),ap=a.M?pct(a.P,a.M):null;if(ap!==null){aSum+=ap;aN++}const rk=rmap[s.id];
  return `<tr><td class="c"><b>${s.roll}</b></td><td><b>${esc(s.name)}</b>${t==='H'?HONB:''}${s.guardian?` <span style="font-size:10.5px;color:#64748b;font-weight:500">· ${esc(s.guardian)}</span>`:''}</td><td class="c">${a.M?`${a.P} / ${a.M}`:'—'}</td><td>${ap===null?'—':`<div class="attb">${miniBar(ap)}<b class="${pctCls(ap)}">${ap}%</b></div>`}</td><td class="c mkc">${v===undefined?'—':v}</td><td>${badge(t)}</td><td class="c">${rankCell(rk,t==='H')}</td></tr>`}).join('');
 const body=`<div class="tbl"><table data-title="Result sheet"><tr><th class="c">Roll</th><th>Student Name</th><th class="c">Sundays Present</th><th>Attendance</th><th class="c">Marks / ${e.fm}</th><th>Result</th><th class="c">Rank</th></tr>${rows||'<tr><td colspan="7" class="muted">No students in this section</td></tr>'}</table></div>`;
 return h+paper({tag:'Result Sheet',sub:esc(e.name),teacher:teacher||'',body,
  info:[['Department',esc(d.name)],['Section',esc(secInfo(cid).c.name)],['Class Teacher',esc(teacher||'—')],['Examination',esc(e.name)],['Marks',`Full ${e.fm} · Pass ${e.pm} · Honours ${e.hm}+`],['Attendance period',`${rangeLabel(ar)} · ${dates.length} Sundays`]],
  tiles:[['Students',x.T,'#312e81','#eef2ff'],['Appeared',x.ap,'#0e7490','#cffafe'],['Honours',x.H,'#6d28d9','#ede9fe'],['Pass',x.P-x.H,'#15803d','#dcfce7'],['Fail',x.F,'#b91c1c','#fee2e2'],['Absent',x.AB,'#475569','#e2e8f0'],['Pass %',x.ap?x.pp+'%':'—','#b45309','#fef3c7'],['Average',x.ap?x.avg:'—','#0f172a','#f1f5f9'],['Highest',x.max??'—','#0f172a','#f1f5f9'],['Avg attendance',aN?Math.round(aSum/aN*10)/10+'%':'—','#0e7490','#ecfeff']]})}
function xMerit(e){const f=U.xF||'all',n=U.xTop||10,ar=U.xAtt||'session';const x=examStats(e,f);const rk=rankRows(x.rows),list=n==='all'?rk:rk.filter(r=>r.rank<=n);
 const h=`<div class="card noprint" style="margin-bottom:12px"><div class="ctl"><select onchange="setU('xF',this.value)">${deptOpts(f,true)}</select><select onchange="setU('xTop',this.value==='all'?'all':+this.value)">${[3,5,10,20,50,'all'].map(v=>`<option value="${v}" ${v===n?'selected':''}>${v==='all'?'All students':'Top '+v}</option>`).join('')}</select><label class="muted" style="font-size:12.5px">Attendance:</label><select onchange="setU('xAtt',this.value)">${monthOpts(ar,true)}</select>${pxBtns('Merit_List')}</div></div>`;
 const held=rangeDates(ar);let aSum=0,aN=0;
 const rows=list.map(r=>{const ds=held.filter(dt=>secStat(dt,r.c.id).taken),a=stuRange(r.s,ds),ap=a.M?pct(a.P,a.M):null;if(ap!==null){aSum+=ap;aN++}
  return `<tr><td class="c">${rankCell(r.rank,r.st==='H')}</td><td><b>${esc(r.s.name)}</b>${r.st==='H'?HONB:''}<div style="font-size:10.5px;color:#64748b">Roll ${r.s.roll}${r.s.guardian?' · '+esc(r.s.guardian):''}</div></td><td>${esc(r.d.name)}</td><td>${esc(r.c.name)}</td><td>${esc(secTeachers(r.c.id)||'—')}</td><td class="c">${a.M?`${a.P} / ${a.M}`:'—'}</td><td>${ap===null?'—':`<div class="attb">${miniBar(ap)}<b class="${pctCls(ap)}">${ap}%</b></div>`}</td><td class="c mkc">${r.v}</td><td>${badge(r.st)}</td></tr>`}).join('');
 const body=`<div class="tbl"><table data-title="Merit list"><tr><th class="c">Rank</th><th>Student Name</th><th>Department</th><th>Section</th><th>Class Teacher</th><th class="c">Sundays Present</th><th>Attendance</th><th class="c">Marks / ${e.fm}</th><th>Result</th></tr>${rows||'<tr><td colspan="9" class="muted">No marks entered yet</td></tr>'}</table></div>`;
 const hon=list.filter(r=>r.st==='H').length;
 const mT=f==='all'?'':[...new Set(S.teachers.filter(t=>t.dept===f).map(t=>t.name))].join(', ');
 return h+paper({tag:'Merit List',sub:esc(e.name),body,teacher:mT,tlabel:f==='all'?'Teacher':'Teacher(s)',
  info:[['Examination',esc(e.name)],['Department',f==='all'?'All departments':esc(deptOf(f)?.name||'')],['Showing',n==='all'?`All ${list.length} students`:`Top ${n} (${list.length} students)`],['Marks',`Full ${e.fm} · Pass ${e.pm} · Honours ${e.hm}+`],['Attendance period',rangeLabel(ar)]],
  tiles:[['In this list',list.length,'#312e81','#eef2ff'],['Honours in list',hon,'#b45309','#fef3c7'],['Top marks',list[0]?list[0].v:'—','#6d28d9','#ede9fe'],['Avg attendance',aN?Math.round(aSum/aN*10)/10+'%':'—','#0e7490','#ecfeff'],['All appeared',x.ap,'#0f172a','#f1f5f9'],['All honours',x.H,'#6d28d9','#ede9fe'],['Pass %',x.ap?x.pp+'%':'—','#15803d','#dcfce7'],['Average marks',x.ap?x.avg:'—','#0f172a','#f1f5f9']]})}
function xExcel(e){const f=U.xEf||'all';
 return `<div class="g2"><div class="card"><h3>${svg('dl',18)} 1. Download marks template</h3><p class="muted">The template already lists your students (Department, Section, Roll No, Name) for <b>${esc(e.name)}</b>. Only type the marks – or <b>AB</b> for absent.</p><div class="ctl"><select onchange="U.xEf=this.value">${deptOpts(f,true)}</select><button class="btn pri" onclick="dlMarks()">Download template</button></div></div>
 <div class="card"><h3>${svg('dl',18)} 2. Upload the filled template</h3><p class="muted">Students are matched by Department + Section + Roll No (or name). Empty marks cells are skipped. You will see a preview before anything is saved.</p><label class="btn pri">Upload marks (.xlsx / .csv)<input type="file" accept=".xlsx,.csv" hidden onchange="importMarks(this)"></label></div></div>
 <div class="card" style="margin-top:14px"><h3>${svg('rep',18)} 3. Export full results to Excel</h3><p class="muted">Every student with marks, result (Honours / Pass / Fail / Absent), section rank and department rank – plus a Summary sheet.</p><button class="btn" onclick="exportResults()">${svg('dl',16)} Export results (.xlsx)</button></div>`}
function tplMarks(e,f){const rows=[['Department','Section','Roll No','Student Name',`Marks (out of ${e.fm})`].map(H)];
 S.depts.forEach(d=>{if(f!=='all'&&d.id!==f)return;d.secs.forEach(c=>studentsOf(c.id).forEach(s=>{const v=markOf(e.id,c.id,s.id);rows.push([d.name,c.name,+s.roll||'',s.name,v===undefined?'':v==='AB'?'AB':+v].map(B))}))});
 const ins=[[{v:S.settings.org+' – Sunday School Results',s:3}],[{v:'Exam: '+e.name,s:2}],[`Full marks: ${e.fm}   ·   Pass marks: ${e.pm}   ·   Honours: ${e.hm} and above`],[''],[`1. Type each student's marks in the "Marks" column (0 to ${e.fm}).`],['2. Type AB for a student who was absent. Leave the cell empty if not known yet.'],['3. Do not change Department, Section, Roll No or Student Name – they are used to find the student.'],['4. Save the file. In the app open Results → Excel Upload / Export → Upload marks.']];
 return XL.book([{name:'Marks',rows,cols:[18,10,9,32,18],freeze:1},{name:'Instructions',rows:ins,cols:[100]}])}
function dlMarks(){const e=curExam();downloadBlob(`SJS_SundaySchool_Marks_${safeName(e.name)}.xlsx`,tplMarks(e,U.xEf||'all'))}
async function importMarks(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const e=curExam();
 try{let rows;if(/\.csv$/i.test(f.name)||/text/.test(f.type))rows=parseCSV(await f.text());else{const sh=await readXlsx(f);const pick=sh.find(s=>/mark|result/i.test(s.name))||sh.find(s=>s.rows.some(r=>r.some(c=>/name/i.test(c))))||sh[0];rows=pick?pick.rows:[]}
  const hi=rows.findIndex(r=>r.some(c=>/name/i.test(String(c))));if(hi<0)throw 'No header row with a "Name" column was found. Please use the marks template.';
  const m=mapCols(rows[hi]);if(m.marks==null)throw 'The "Marks" column is missing. Please use the marks template.';
  const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));const r={upd:0,blank:0,nf:0,bad:0,errs:[],ch:[]};
  data.forEach((row,i)=>{const g=k=>m[k]==null?'':String(row[m[k]]??'').trim();const name=g('name'),mv=g('marks');if(mv===''){r.blank++;return}
   const dn=g('dept'),sn=g('sec').replace(/^(section|sec\.?)\s*/i,'').trim(),roll=parseInt(g('roll'));const cands=[];
   S.depts.forEach(d=>{if(dn&&d.name.trim().toLowerCase()!==dn.toLowerCase())return;d.secs.forEach(c=>{if(sn&&c.name.trim().toLowerCase()!==sn.toLowerCase())return;studentsOf(c.id).forEach(s=>cands.push({s,c}))})});
   const nm=x=>x.s.name.trim().toLowerCase()===name.toLowerCase();
   let hit=!isNaN(roll)?cands.filter(x=>+x.s.roll===roll&&(!name||nm(x))):[];
   if(!hit.length&&!isNaN(roll)&&dn&&sn)hit=cands.filter(x=>+x.s.roll===roll);
   if(!hit.length&&name)hit=cands.filter(nm);
   if(hit.length!==1){r.nf++;r.errs.push(`Row ${i+2}: ${name||'?'} – ${hit.length?'matches more than one student':'student not found'}`);return}
   const v=parseMark(mv,e);if(v===null){r.bad++;r.errs.push(`Row ${i+2}: "${mv}" is not valid (use 0–${e.fm} or AB)`);return}
   r.ch.push({cid:hit[0].c.id,sid:hit[0].s.id,v});r.upd++});
  modal('Upload marks – '+esc(e.name),`<p>File: <b>${esc(f.name)}</b> · ${data.length} rows</p><div class="lst"><div><span>Marks to save</span><b class="ok">${r.upd}</b></div><div><span>Empty marks (skipped)</span><b>${r.blank}</b></div><div><span>Student not found</span><b class="${r.nf?'bad':''}">${r.nf}</b></div><div><span>Invalid marks</span><b class="${r.bad?'bad':''}">${r.bad}</b></div></div>${r.errs.length?`<div class="banner o" style="margin-top:12px;display:block">${r.errs.slice(0,8).map(esc).join('<br>')}${r.errs.length>8?'<br>…':''}</div>`:''}`,
   [{t:'Cancel'},{t:'Save marks',cls:'pri',fn:()=>{if(!r.ch.length)return;r.ch.forEach(x=>putMark(e.id,x.cid,x.sid,x.v));save();rerender();toast(r.upd+' marks saved')}}])
 }catch(err){toast(esc(String(err&&err.message||err)))}}
function exportResults(){const e=curExam(),all=examStats(e),secRank={},deptRank={};
 S.depts.forEach(d=>{rankRows(examStats(e,d.id).rows).forEach(x=>deptRank[x.s.id]=x.rank);d.secs.forEach(c=>rankRows(examStats(e,d.id,c.id).rows).forEach(x=>secRank[x.s.id]=x.rank))});
 const rows=[[{v:S.settings.org+' – Sunday School',s:3}],[{v:`${e.name} · Full marks ${e.fm} · Pass ${e.pm} · Honours ${e.hm}+`,s:2}],[],['Department','Section','Roll No','Student Name','Marks','Result','Section Rank','Department Rank'].map(H)];
 S.depts.forEach(d=>d.secs.forEach(c=>studentsOf(c.id).forEach(s=>{const v=markOf(e.id,c.id,s.id),t=resStatus(v,e);rows.push([d.name,c.name,+s.roll||'',s.name,v===undefined?'':v==='AB'?'AB':+v,RS[t][0],secRank[s.id]||'',deptRank[s.id]||''].map(B))})));
 const T=(x,n)=>[n,x.T,x.ap,x.H,x.P-x.H,x.F,x.AB,x.NE,x.ap?x.pp:'',x.ap?x.avg:'',x.max??''];
 const sum=[[{v:'Result Summary – '+e.name,s:3}],[`Full marks ${e.fm} · Pass marks ${e.pm} · Honours ${e.hm} and above`],[],['Department','Students','Appeared','Honours','Pass','Fail','Absent','Not entered','Pass %','Average','Highest'].map(H),...S.depts.map(d=>T(examStats(e,d.id),d.name).map(B)),T(all,'TOTAL').map(v=>({v,s:5}))];
 downloadBlob(`SJS_SundaySchool_Results_${safeName(e.name)}.xlsx`,XL.book([{name:'Results',rows,cols:[18,10,9,32,10,13,13,16],freeze:4},{name:'Summary',rows:sum,cols:[22,10,10,10,10,10,10,12,10,10,10]}]))}
function editExam(id){const x=id?examList().find(q=>q.id===id):null;
 modal(x?'Marks settings':'New exam',`<div class="form"><div class="fld full"><label>Exam name</label><input type="text" name="n" value="${esc(x?x.name:'')}" placeholder="e.g. Annual Examination 2026-27"></div>
 <div class="fld"><label>Full marks</label><input type="number" name="fm" value="${x?x.fm:100}" min="1"></div><div class="fld"><label>Pass marks</label><input type="number" name="pm" value="${x?x.pm:40}" min="0"></div>
 <div class="fld"><label>Honours (marks and above)</label><input type="number" name="hm" value="${x?x.hm:85}" min="0"></div>
 <div class="fld full muted" style="font-size:12px">Result is worked out automatically: <b>Honours</b> = Honours marks or more · <b>Pass</b> = Pass marks or more · <b>Fail</b> = below Pass marks · <b>AB</b> = Absent. Changing these updates every result instantly.</div></div>`,
 [...(x&&examList().length>1?[{t:'Delete exam',cls:'danger',fn:()=>{delExam(x.id)}}]:[]),{t:'Cancel'},{t:x?'Save':'Create exam',cls:'pri',fn:w=>{const n=val(w,'n'),fm=+val(w,'fm'),pm=+val(w,'pm'),hm=+val(w,'hm');
  if(!n){toast('Enter the exam name');return false}
  if(!(fm>0)||!(pm>=0)||!(hm>pm)||hm>fm){toast('Check the marks: Pass marks < Honours ≤ Full marks');return false}
  if(x)Object.assign(x,{name:n,fm,pm,hm,u:now()});else{const nid=newId('e');S.exams.push({id:nid,name:n,fm,pm,hm,u:now()});U.exam=nid}
  save();rerender();toast('Exam saved')}}])}
async function delExam(id){const x=S.exams.find(q=>q.id===id);if(!await ask(`Delete exam <b>${esc(x.name)}</b> and all its marks?`,'Delete exam',true))return;S.exams=S.exams.filter(q=>q.id!==id);(S.del=S.del||{})[id]=now();if(S.res)delete S.res[id];U.exam=null;save();rerender()}

/* ============ Boot ============ */
function netPill(){const e=$('#netState');if(e)e.innerHTML=navigator.onLine?'<span style="color:#86efac">●</span> Online':'<span style="color:#fcd34d">●</span> Offline mode – data still saves'}
(async function boot(){
 $('#logoIc').innerHTML=svg('cross',22);
 await Store.open();
 const d=await Store.get();
 if(d&&Array.isArray(d.depts)){S=normalize(d)}
 else{defState();saveRaw()}
 cfg=(await Store.get('sync'))||{};
 setSaved(true);netPill();window.addEventListener('online',netPill);window.addEventListener('offline',netPill);
 window.addEventListener('hashchange',render);render();updInstall();setSync();
 window.addEventListener('online',()=>syncNow(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(false)});
 setInterval(()=>{if(cfg.url&&cfg.auto!==false&&!document.hidden)syncNow(false)},90000);if(cfg.url)setTimeout(()=>syncNow(false),1500);
 try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){fetch('sw.js',{method:'HEAD'}).then(r=>{if(r.ok){navigator.serviceWorker.register('sw.js').catch(()=>{});const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l)}}).catch(()=>{})}}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
