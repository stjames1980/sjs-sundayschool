<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SJS Sunday School App</title>
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e6e9f2;--pri:#4f46e5;--pri-d:#3730a3;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--lv:#d97706;--lvb:#fef3c7;--off:#0891b2;--offb:#cffafe;--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.06)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:236px;background:linear-gradient(180deg,#1e1b4b 0%,#312e81 100%);color:#e0e7ff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 20px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#22d3ee);display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 6px 16px rgba(34,211,238,.25)}
.brand b{display:block;font-size:14px;color:#fff;line-height:1.2}.brand small{color:#a5b4fc;font-size:11.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c7d2fe;text-decoration:none;font-weight:550;margin-bottom:3px;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri-d);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.side .foot{margin-top:auto;font-size:11.5px;color:#a5b4fc;padding:8px;line-height:1.5}
.main{flex:1;margin-left:236px;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:var(--pri-d);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:650;white-space:nowrap}
.pill.g{background:var(--okb);color:#166534}.pill.o{background:var(--lvb);color:#92400e}.pill.r{background:var(--badb);color:#991b1b}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1.1fr 2fr;gap:14px}
.stack>*+*{margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px 18px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#4f46e5)}
.kpi .l{padding-right:38px;font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{white-space:nowrap;font-size:27px;font-weight:800;margin-top:3px;letter-spacing:-.02em;color:var(--ink)}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cb,#eef2ff);color:var(--c,#4f46e5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{border-color:#c7cbe0;background:#fafbff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-width:0;outline:none}
select:focus,input:focus,textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #e0e7ff}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:12px;color:var(--mut);font-weight:650}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}
table{border-collapse:collapse;width:100%}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl table th{background:#f6f7fc;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#475569;text-align:left;position:sticky;top:0;z-index:1}
.tbl table th,.tbl table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl table tr:last-child td{border-bottom:none}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.c,.tbl th.c{text-align:center}
tr.sub td{background:#f8f9ff;font-weight:700}
tr.tot td{background:#eef2ff;font-weight:800;color:var(--pri-d)}
tr.dh td{background:#fbfbfe;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:650;cursor:pointer;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .ck{font-size:11px;color:var(--ok)}.chip.on .ck{color:#bbf7d0}
.tabs{display:flex;gap:4px;background:#e9ecf6;border-radius:12px;padding:4px;overflow:auto;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:650;color:#475569;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--pri-d);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* roll call */
.rsum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rsum div{border-radius:12px;padding:8px 10px;text-align:center;background:#f6f7fc}
.rsum b{display:block;font-size:20px}.rsum span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
.rsum .p{background:var(--okb)}.rsum .p b{color:#15803d}.rsum .a{background:var(--badb)}.rsum .a b{color:#b91c1c}.rsum .lv{background:var(--lvb)}.rsum .lv b{color:#b45309}
.srow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.roll{width:34px;height:34px;border-radius:10px;background:#eef2ff;color:var(--pri-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.nm small{color:var(--mut);font-size:11.5px}
.seg{display:flex;gap:5px;flex:none}
.seg button{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:#94a3b8;transition:.1s}
.seg .P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg .A.on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg .L.on{background:var(--lv);border-color:var(--lv);color:#fff}
.srow.mP .roll{background:var(--okb);color:#15803d}.srow.mA .roll{background:var(--badb);color:#b91c1c}.srow.mL .roll{background:var(--lvb);color:#b45309}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.o{background:var(--lvb);color:#92400e}.banner.i{background:#eef2ff;color:var(--pri-d)}
/* charts */
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;position:relative;min-height:2px}
.col .bv{font-size:10.5px;font-weight:700;color:#334155;margin-bottom:3px;white-space:nowrap}
.col .bl{font-size:10.5px;color:var(--mut);margin-top:5px;white-space:nowrap}
.hb{margin-bottom:11px}.hb .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}.hb .t b{font-weight:650}
.hb .tr{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#eef0f6}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.donutw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:160px;height:160px;flex:none}
.lst{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.lst div{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.mini{height:7px;border-radius:9px;background:#eef0f6;overflow:hidden;min-width:60px}.mini i{display:block;height:100%;border-radius:9px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800;font-size:11px}
.cell.P{background:var(--okb);color:#15803d}.cell.A{background:var(--badb);color:#b91c1c}.cell.L{background:var(--lvb);color:#b45309}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;border-left:5px solid var(--c)}
.dcard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dcard .hd b{font-size:15px}
.sc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 10px;font-weight:650;background:#fafbff}
.sc button{border:0;background:transparent;cursor:pointer;color:#94a3b8;padding:2px 5px;border-radius:6px}.sc button:hover{background:#eef0f6;color:var(--bad)}
.capbar{height:8px;border-radius:9px;background:#eef0f6;overflow:hidden;width:140px}.capbar i{display:block;height:100%}
/* modal & toast */
.mwrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:100;padding:14px;animation:fd .15s}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.mh b{font-size:16px}
.mh .x{border:0;background:#f1f5f9;width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer}
.mb{padding:16px;overflow:auto}.mb p{margin:0 0 8px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;font-size:13.5px}
.toast button{background:#334155;color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:650;cursor:pointer}
.bnav{display:none}
.rh{display:none}
.muted{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.lvc{color:var(--lv)}
.right{text-align:right}
@media (max-width:1100px){.g3{grid-template-columns:1fr}}
@media (max-width:860px){
 .side{display:none}.main{margin:0;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
 .g2{grid-template-columns:1fr}.form{grid-template-columns:1fr}
 .top h1{font-size:19px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:9px}.kpi .v{font-size:23px}.kpi .ic{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#64748b;text-decoration:none;font-weight:650;padding:4px 0;border-radius:10px;cursor:pointer}
 .bnav a.on{color:var(--pri)}
 .bnav a.on svg{background:#eef2ff;border-radius:9px;padding:3px;width:34px}
 .seg button{width:42px;height:40px}
 .rsum b{font-size:17px}
 .cols{height:160px}.col .bl{font-size:9px}.col .bv{font-size:9px}
}
@media print{
 @page{size:A4;margin:6mm}
 html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff!important}
 .app,.main{background:#fff!important}
 body{background:#fff;font-size:11.5px}
 .side,.bnav,.noprint,.top,.tabs,.toast{display:none!important}
 .main{margin:0;padding:0}
 .card{box-shadow:none;border:0;padding:0}
 .rh{display:block;text-align:center;border-bottom:2px solid #312e81;padding-bottom:8px;margin-bottom:12px}
 .rh h2{margin:0;font-size:18px;color:#312e81}.rh div{font-size:12px}
 .tbl{border:1px solid #cbd5e1;overflow:visible;border-radius:0}
 .tbl table th,.tbl table td{padding:4px 6px;border:1px solid #cbd5e1}
 .tbl table th{position:static}
 .sig{margin-top:40px}
 .cell{width:16px;height:16px;font-size:9px}
 tr{page-break-inside:avoid}
 .landscape-hint{display:none}
}
.instb{display:flex;align-items:center;gap:8px;margin:12px 4px 0;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#a5b4fc);color:#0b1033;font-weight:750;cursor:pointer;justify-content:center}
.syncpill{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:650}
.sigpad{width:100%;height:auto;aspect-ratio:3/1;border:2px dashed #c7d2fe;border-radius:12px;background:#fafbff;touch-action:none;cursor:crosshair;display:block}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:28px;flex-wrap:wrap}
.sig .sb{min-width:190px;text-align:center;font-weight:700}
.sig .sb .im{height:60px;display:flex;align-items:flex-end;justify-content:center}
.sig .sb img{max-height:60px;max-width:200px}
.sig .sb .ln{border-top:1.5px solid #0f172a;padding-top:4px}
.sig small{display:block;font-weight:500;color:#475569}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;padding:0}
.cdot.on{box-shadow:0 0 0 3px #0f172a}
.secrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.secrow input{flex:1}
ol.steps{margin:0 0 12px;padding-left:20px;line-height:1.75}
.rbadge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:750;white-space:nowrap}
.mk{width:70px;text-align:center;font-weight:800;font-size:16px;padding:7px 6px!important;flex:none}
.xab{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:#94a3b8;cursor:pointer;font-size:12px;flex:none}
.xab.on{background:#475569;border-color:#475569;color:#fff}
.rsum .hn{background:#ede9fe}.rsum .hn b{color:#6d28d9}
.srow.rH .roll{background:#ede9fe;color:#6d28d9}.srow.rP .roll{background:var(--okb);color:#15803d}.srow.rF .roll{background:var(--badb);color:#b91c1c}.srow.rAB .roll{background:#e2e8f0;color:#475569}
@media (max-width:860px){.xb{display:none}.bnav a{font-size:9.5px}.bnav a.on svg{width:30px}}

/* ---- honours badge ---- */
.honb{display:inline-flex;align-items:center;gap:2px;margin-left:5px;padding:0 6px 0 2px;border-radius:999px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:7.5px;line-height:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px;border:1px solid #f59e0b;white-space:nowrap}
.honb i{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#d97706);display:grid;place-items:center;color:#fff;font-style:normal}
.mdl{display:inline-block;width:20px;text-align:center;font-size:14px;vertical-align:-1px}.rkp{display:inline-grid;place-items:center;min-width:26px;height:22px;border-radius:7px;background:#eef2ff;color:#3730a3;font-weight:800;padding:0 5px}
/* ---- paper (modern printable sheet) ---- */
.paper{background:#fff;border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line);padding:22px;margin:0 auto;font-size:13px;color:#0f172a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .rh{display:none!important}
.pp-head{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#1e1b4b 0%,#3730a3 55%,#7c3aed 100%);color:#fff;border-radius:14px;padding:14px 18px;position:relative;overflow:hidden}
.pp-head::before{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.07)}
.pp-head::after{content:"";position:absolute;right:120px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.05)}
.pp-logo{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none;border:1.5px solid rgba(255,255,255,.35);color:#fff}
.pp-org{flex:1;min-width:0;position:relative;z-index:1}.pp-org b{display:block;font-size:21px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}.pp-org span{font-size:12px;opacity:.88}
.pp-tag{text-align:right;position:relative;z-index:1}.pp-tag b{display:inline-block;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px}.pp-tag small{display:block;font-size:11.5px;opacity:.9;margin-top:5px}
.pp-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.pp-info div{border:1px solid #e0e4f2;border-left:4px solid #6366f1;border-radius:10px;padding:7px 10px;background:#f8f9ff}
.pp-info small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#6366f1}
.pp-info b{font-size:13px;font-weight:750}
.paper .tbl{border:1px solid #dfe3f0;border-radius:12px;overflow:auto}
.paper table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.paper table th{background:#312e81;color:#fff;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 9px;border:0}
.paper table td{padding:7px 9px;border-bottom:1px solid #edf0f7}
.paper table tbody tr:nth-child(even) td{background:#f7f8fd}
.paper tr.sub td{background:#e0e7ff!important;font-weight:750}
.paper tr.tot td{background:#312e81!important;color:#fff!important;font-weight:800}
.paper tr.dh td{background:#eef2ff!important}
.paper td.mkc{font-size:15px;font-weight:800}
.paper .ok{color:#15803d}.paper .bad{color:#b91c1c}.paper .lvc{color:#b45309}
.pp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.pp-tiles div{border-radius:10px;padding:8px 6px;background:var(--b);text-align:center;border:1px solid rgba(0,0,0,.04)}
.pp-tiles b{display:block;font-size:19px;color:var(--c);line-height:1.2}.pp-tiles span{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#475569}

<script type="text/plain" id="gsCode">
/**
 * SJS Sunday School App - Cloud Sync server (Google Apps Script)
 * ---------------------------------------------------------------
 * 1. Change SYNC_KEY below to your own secret word (use the same word in the app).
 * 2. Save, choose the function "setup" and press Run once (allow the permissions).
 * 3. Deploy > New deployment > type: Web app
 *      Execute as: Me      Who has access: Anyone
 *    Copy the Web app URL and paste it in the app: Setup > Cloud Sync.
 * The full data is kept in your Google Drive (file SJS_SundaySchool_CloudData.json).
 * This Google Sheet shows Students, Teachers and Sunday Summary (view only - edit in the app).
 */
const SYNC_KEY = 'CHANGE-THIS-KEY';

function setup() {
  dataFile_();
  Logger.log('Cloud sync is ready. Now deploy as a Web app.');
}

function doGet() {
  const rev = Number(PropertiesService.getScriptProperties().getProperty('rev') || 0);
  return out_({ ok: true, app: 'SJS Sunday School Sync', rev: rev });
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  try { lock.waitLock(25000); } catch (err) { return out_({ ok: false, error: 'Server busy, please try again' }); }
  try {
    const req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    if (!req.key || req.key !== SYNC_KEY) return out_({ ok: false, error: 'Wrong sync key' });
    const props = PropertiesService.getScriptProperties();
    const rev = Number(props.getProperty('rev') || 0);

    if (req.action === 'pull') {
      if (Number(req.rev) === rev) return out_({ ok: true, same: true, rev: rev });
      const data = rev ? dataFile_().getBlob().getDataAsString() : '';
      return out_({ ok: true, rev: rev, data: data, at: props.getProperty('at') || '', by: props.getProperty('by') || '' });
    }

    if (req.action === 'push') {
      if (Number(req.base) !== rev) return out_({ ok: false, conflict: true, rev: rev });
      dataFile_().setContent(String(req.data || ''));
      props.setProperties({ rev: String(rev + 1), at: new Date().toISOString(), by: String(req.device || '') });
      if (req.summary) { try { writeSheets_(req.summary); } catch (err) {} }
      return out_({ ok: true, rev: rev + 1 });
    }
    return out_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function dataFile_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('fileId');
  if (id) { try { return DriveApp.getFileById(id); } catch (e) {} }
  const f = DriveApp.createFile('SJS_SundaySchool_CloudData.json', '{}', 'text/plain');
  props.setProperty('fileId', f.getId());
  return f;
}

function writeSheets_(s) {
  const ss = SpreadsheetApp.getActive();
  if (!ss) return;
  put_(ss, 'Students', ['Department', 'Section', 'Roll', 'Name', 'Gender', 'Guardian', 'Phone', 'Attendance %'], s.students);
  put_(ss, 'Teachers', ['Name', 'Role', 'Department', 'Section', 'Phone', 'Attendance %'], s.teachers);
  put_(ss, 'Sunday Summary', ['Date', 'Enrolled', 'Present', 'Absent', 'Leave', 'Attendance %', 'Offering', 'Teachers Present'], s.sundays);
  put_(ss, 'Sync Info', ['Last update', 'From device'], [[new Date(), s.device || '']]);
}

function put_(ss, name, head, rows) {
  const sh = ss.getSheetByName(name) || ss.insertSheet(name);
  sh.clearContents();
  const data = [head].concat(rows || []).map(function (r) {
    const a = (r || []).slice(0, head.length);
    while (a.length < head.length) a.push('');
    return a;
  });
  sh.getRange(1, 1, data.length, head.length).setValues(data);
  sh.getRange(1, 1, 1, head.length).setFontWeight('bold').setBackground('#4f46e5').setFontColor('#ffffff');
  sh.setFrozenRows(1);
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

};

/* ============ Storage (IndexedDB + localStorage mirror) ============ */
const KEY='sjs_sunday_school_v1';
const Store={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('sjs_sunday_school',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 lk(k){return k==='state'?KEY:KEY+'_'+k},
 get(k='state'){return new Promise(res=>{const ls=()=>{try{const j=localStorage.getItem(this.lk(k));return j?JSON.parse(j):null}catch(e){return null}};
  if(!this.db)return res(ls());
  try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||ls());q.onerror=()=>res(ls())}catch(e){res(ls())}})},
 put(v,k='state'){const st=k==='state';let ok=false;
  if(this.db){try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);if(st){tx.oncomplete=()=>setSaved(true);tx.onerror=()=>setSaved(false)}ok=true}catch(e){}}
  try{localStorage.setItem(this.lk(k),JSON.stringify(v));if(!this.db&&st)setSaved(true)}catch(e){if(!ok&&st)setSaved(false)}
 }
};
let S,_idx=null,saveT=null;

function setSaved(v){const e=$('#saveState');if(!e)return;e.innerHTML=v==='saving'?'● Saving…':v?'<span style="color:#86efac">●</span> All changes saved on this device':'<span style="color:#fca5a5">●</span> Could not save — export a backup'}

/* ============ State ============ */
function newId(p){S.seq=(S.seq||1)+1;return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const now=()=>Date.now();function stamp(k){(S.ts=S.ts||{})[k]=now()}
function defSettings(){return{org:'St. James H.S. School',sub:'Sunday School',place:'Gongrai, Sepahijala, Tripura',session:'2026-2027',start:'2026-03-01',end:'2027-04-30',cur:'₹',low:75,cap:60,supt:'',secy:''}}
function defState(){
 S={v:1,seq:1,settings:defSettings(),
  depts:[],students:[],teachers:[],att:{},tatt:{},off:{},hol:{},ts:{},del:{},base:0,su:0,res:{},exams:[],toff:{},pristine:true,lastBackup:null};
 DEFAULT_DEPTS.forEach((n,i)=>S.depts.push({id:newId('d'),name:n,color:COLORS[i%COLORS.length],u:0,o:i,secs:'ABCDE'.split('').map(x=>({id:newId('c'),name:x}))}));
 return S;
}

const studentsOf=cid=>idx()[cid]||[];

function secInfo(cid){for(const d of S.depts){const c=d.secs.find(c=>c.id===cid);if(c)return{d,c}}return null}
function secLabel(cid){const i=secInfo(cid);if(!i)return '—';const n=String(i.c.name);return n.toLowerCase().startsWith(i.d.name.toLowerCase())?n:`${i.d.name} – ${n}`}
function secNm(n){n=String(n??'');return n.length<=2?'Section '+esc(n):esc(n)}

/* ============ Dates ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>parse(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

function sundays(){const a=[];let d=parse(S.settings.start);const e=parse(S.settings.end);if(isNaN(d)||isNaN(e))return a;while(d.getDay()!==0)d.setDate(d.getDate()+1);let g=0;while(d<=e&&g++<600){a.push(iso(d));d.setDate(d.getDate()+7)}return a}

 let taken=false;for(const _ in m){taken=true;break}

  d.secs.forEach(c=>{const s=secStat(date,c.id);dd.secs.push(Object.assign({c},s));KS.forEach(k=>dd[k]+=s[k]);if(s.T||s.taken){o.secTotal++;if(s.taken)o.secTaken++}});
  KS.forEach(k=>o[k]+=dd[k]);o.depts.push(dd)});

/* ============ Charts ============ */
function donut(parts,center,sub){const tot=parts.reduce((a,p)=>a+p.v,0);const R=58,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 160 160" class="donut"><circle cx="80" cy="80" r="${R}" fill="none" stroke="#eef0f6" stroke-width="20"/>`;
 if(tot)parts.forEach(p=>{const len=p.v/tot*C;if(len>0){s+=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${Math.max(len-1.5,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`}off+=len});
 return s+`<text x="80" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">${center}</text><text x="80" y="100" text-anchor="middle" font-size="11" fill="#64748b">${sub}</text></svg>`}
function cols(pts,color,fmt){if(!pts.length)return `<div class="empty" style="padding:30px">No Sundays recorded yet</div>`;const mx=Math.max(...pts.map(p=>p.v),1);
 return `<div class="cols">${pts.map(p=>`<div class="col" title="${esc(p.t||p.l)}"><div class="bv">${fmt?fmt(p.v):p.v}</div><div class="bar" style="height:${Math.max(p.v/mx*100,1.5)}%;background:${p.c||color}"></div><div class="bl">${esc(p.l)}</div></div>`).join('')}</div>`}
function hbar(label,parts,right){const t=parts.reduce((a,p)=>a+p.v,0)||1;return `<div class="hb"><div class="t"><b>${label}</b><span class="muted">${right}</span></div><div class="tr">${parts.map(p=>p.v?`<i style="width:${p.v/t*100}%;background:${p.c}" title="${p.n}: ${p.v}"></i>`:'').join('')}</div></div>`}
const miniBar=(p,c)=>`<div class="mini"><i style="width:${Math.min(p,100)}%;background:${c||(p>=S.settings.low?'#16a34a':p>=50?'#d97706':'#dc2626')}"></i></div>`;
const pctCls=p=>p>=S.settings.low?'ok':p>=50?'lvc':'bad';

/* ============ Router ============ */
function navHTML(m){return VIEWS.map(([k,l,i])=>`<a class="${U.view===k?'on':''}" onclick="go('${k}')">${svg(i)}<span>${m&&k==='dashboard'?'Home':m&&k==='rollcall'?'Roll Call':l}</span></a>`).join('')}
function render(){
 const h=(location.hash||'').replace('#','');if(VIEWS.some(v=>v[0]===h))U.view=h;
 $('#nav').innerHTML=navHTML();$('#bnav').innerHTML=navHTML(1);
 $('#brandOrg').textContent=S.settings.org;
 const su=sundays();if(!U.date||!su.includes(U.date))U.date=defaultSunday();
 const fn={dashboard:vDash,rollcall:vRoll,teachers:vTeach,students:vStud,reports:vRep,results:vResults,setup:vSetup}[U.view];
 $('#main').innerHTML=fn();window.scrollTo&&window.scrollTo(0,0);
}
function rerender(){const y=window.scrollY;const fn={dashboard:vDash,rollcall:vRoll,teachers:vTeach,students:vStud,reports:vRep,results:vResults,setup:vSetup}[U.view];$('#main').innerHTML=fn();window.scrollTo(0,y)}
function topbar(t,sub,ctl){return `<div class="top"><div><h1>${t}</h1><div class="sub">${sub||esc(S.settings.org)+' · '+esc(S.settings.sub)+' · Session '+esc(S.settings.session)}</div></div><div class="sp"></div>${syncPillHTML()}${ctl||''}</div>`}
const setU=(k,v)=>{U[k]=v;rerender()};

/* ============ DASHBOARD ============ */
function vDash(){
 if(!S.depts.length)return topbar('Dashboard')+emptyBox('No departments yet','Add departments and sections in Setup to begin.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 const f=U.dashDept,d=U.date,a=aggDate(d,f),t=tStat(d,f);
 const held=heldDates(),past=held.filter(x=>x<=d).slice(-12);
 const trend=past.map(x=>{const g=aggDate(x,f);return{l:fmtS(x),t:fmtD(x),v:pct(g.P,g.M),off:g.off+(f==='all'?tOff(x):0),P:g.P}});
 const sessOff=offRange(held,f)+(f==='all'?toffRange(held):0);
 const avg=trend.length?Math.round(held.map(x=>{const g=aggDate(x,f);return pct(g.P,g.M)}).reduce((p,c)=>p+c,0)/held.length*10)/10:0;
 const boys=S.students.filter(s=>{const i=secInfo(s.sec);return i&&(f==='all'||i.d.id===f)&&s.g==='M'}).length;
 const girls=S.students.filter(s=>{const i=secInfo(s.sec);return i&&(f==='all'||i.d.id===f)&&s.g==='F'}).length;
 const ctl=`<div class="ctl"><select onchange="setU('date',this.value)">${dateOpts(d)}</select><select onchange="setU('dashDept',this.value)">${deptOpts(f,true)}</select></div>`;
 let h=topbar('Dashboard','Sunday '+fmtD(d)+' · '+(f==='all'?'All departments':esc(deptOf(f)?.name)),ctl);
 if(S.hol[d])h+=`<div class="banner o" style="margin-bottom:14px">${svg('cal')}<b>No Sunday School on this day</b> — ${esc(S.hol[d])}</div>`;
 else if(!a.secTaken)h+=`<div class="banner i" style="margin-bottom:14px">${svg('roll')}<span>Roll call has not been taken for this Sunday yet.</span><span class="sp"></span><button class="btn sm pri" onclick="go('rollcall')">Take roll call</button></div>`;
 h+=`<div class="kpis">
 ${kpi('Total Students',num(a.T),`Boys ${boys} · Girls ${girls}`,'#4f46e5','#eef2ff','users')}
 ${kpi('Present',num(a.P),pct(a.P,a.T)+'% of enrolled','#16a34a','#dcfce7','check')}
 ${kpi('Absent',num(a.A),pct(a.A,a.T)+'% of enrolled','#dc2626','#fee2e2','x')}
 ${kpi('Leave',num(a.L),a.U?num(a.U)+' not marked':'All marked','#d97706','#fef3c7','leave')}
 ${kpi('Attendance',pct(a.P,a.M)+'%',`${a.secTaken}/${a.secTotal} sections marked`,'#7c3aed','#ede9fe','pct')}
 ${kpi('Offering',money(a.off+(f==='all'?tOff(d):0)),f==='all'?`Students ${money(a.off)} · Teachers ${money(tOff(d))}`:'Students – this department','#0891b2','#cffafe','coin')}
 ${kpi('Teachers Present',`${t.P}<span style="font-size:15px;color:#94a3b8">/${t.T}</span>`,`Absent ${t.A} · Leave ${t.L}`,'#db2777','#fce7f3','teach')}
 ${kpi('Session Offering',money(sessOff),`${held.length} Sundays held · avg ${avg}%`,'#0d9488','#ccfbf1','cal')}
 </div>`;
 h+=`<div class="g3" style="margin-top:14px">
 <div class="card"><h3>Attendance split <small>${fmtD(d)}</small></h3><div class="donutw">${donut([{v:a.P,c:'#16a34a'},{v:a.A,c:'#dc2626'},{v:a.L,c:'#d97706'},{v:a.U,c:'#cbd5e1'}],pct(a.P,a.M)+'%','present')}
 <div class="lst"><div><span><i class="dot ok"></i> Present</span><b>${a.P}</b></div><div><span><i class="dot bad"></i> Absent</span><b>${a.A}</b></div><div><span><i class="dot lvc"></i> Leave</span><b>${a.L}</b></div><div><span><i class="dot" style="color:#cbd5e1"></i> Not marked</span><b>${a.U}</b></div><div><span class="muted">Boys / Girls present</span><b>${a.B} / ${a.G}</b></div></div></div></div>
 <div class="card"><h3>Department-wise attendance</h3>${a.depts.map(x=>hbar(`<i class="dot" style="color:${x.d.color}"></i> ${esc(x.d.name)}`,[{v:x.P,c:'#16a34a',n:'Present'},{v:x.L,c:'#f59e0b',n:'Leave'},{v:x.A,c:'#ef4444',n:'Absent'},{v:x.U,c:'#e2e8f0',n:'Not marked'}],`${x.P}/${x.T} · <b class="${pctCls(pct(x.P,x.P+x.A+x.L))}">${pct(x.P,x.P+x.A+x.L)}%</b>`)).join('')||'<div class="muted">No departments</div>'}
 <div class="leg"><span><i style="background:#16a34a"></i>Present</span><span><i style="background:#f59e0b"></i>Leave</span><span><i style="background:#ef4444"></i>Absent</span><span><i style="background:#e2e8f0"></i>Not marked</span></div></div></div>`;
 h+=`<div class="g2" style="margin-top:14px">
 <div class="card"><h3>Attendance trend <small>last ${trend.length} Sundays (%)</small></h3>${cols(trend,'linear-gradient(180deg,#818cf8,#4f46e5)',v=>v+'%')}</div>
 <div class="card"><h3>Offering trend <small>${S.settings.cur} per Sunday</small></h3>${cols(trend.map(x=>({l:x.l,t:x.t,v:x.off})),'linear-gradient(180deg,#67e8f9,#0891b2)',v=>v>=1000?(v/1000).toFixed(1)+'k':v)}</div></div>`;
 // dept table
 h+=`<div class="card" style="margin-top:14px"><h3>Department summary <small>${fmtD(d)}</small></h3><div class="tbl"><table><tr><th>Department</th><th class="n">Sections</th><th class="n">Students</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th>Attendance</th><th class="n">Offering</th><th class="n">Teachers</th></tr>
 ${a.depts.map(x=>{const p=pct(x.P,x.P+x.A+x.L),tt=tStat(d,x.d.id);return `<tr><td><i class="dot" style="color:${x.d.color}"></i> <b>${esc(x.d.name)}</b></td><td class="n">${x.d.secs.length}</td><td class="n">${x.T}</td><td class="n ok">${x.P}</td><td class="n bad">${x.A}</td><td class="n lvc">${x.L}</td><td><div style="display:flex;gap:8px;align-items:center">${miniBar(p)}<b class="${pctCls(p)}">${p}%</b></div></td><td class="n">${money(x.off)}</td><td class="n">${tt.P}/${tt.T}</td></tr>`}).join('')}
 <tr class="tot"><td>Total</td><td class="n">${a.depts.reduce((s,x)=>s+x.d.secs.length,0)}</td><td class="n">${a.T}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td>${pct(a.P,a.M)}%</td><td class="n">${money(a.off)}</td><td class="n">${t.P}/${t.T}</td></tr></table></div></div>`;
 // pending
 const pend=[];a.depts.forEach(x=>x.secs.forEach(s=>{if(s.T&&!s.taken)pend.push({d:x.d,c:s.c,T:s.T})}));
 const best=a.depts.filter(x=>x.P+x.A+x.L).map(x=>({n:x.d.name,p:pct(x.P,x.P+x.A+x.L)})).sort((p,q)=>q.p-p.p);
 h+=`<div class="g2" style="margin-top:14px"><div class="card"><h3>Roll call pending <small>${pend.length} section(s)</small></h3>${S.hol[d]?'<div class="muted">No class this Sunday.</div>':pend.length?`<div class="chips">${pend.map(p=>`<button class="chip" onclick="openRoll('${p.d.id}','${p.c.id}')"><i class="dot" style="color:${p.d.color}"></i>${esc(p.d.name)} ${esc(p.c.name)} <span class="muted" style="font-weight:500">(${p.T})</span></button>`).join('')}</div>`:'<div class="ok"><b>✓ All sections with students are marked.</b></div>'}</div>
 <div class="card"><h3>Highlights</h3><div class="lst">
 <div><span class="muted">Best department today</span><b>${best[0]?esc(best[0].n)+' · '+best[0].p+'%':'—'}</b></div>
 <div><span class="muted">Needs attention</span><b>${best.length>1?esc(best[best.length-1].n)+' · '+best[best.length-1].p+'%':'—'}</b></div>
 <div><span class="muted">Sundays held this session</span><b>${held.length} of ${sundays().length}</b></div>
 <div><span class="muted">Average attendance (session)</span><b>${avg}%</b></div>
 <div><span class="muted">Total offering (session)</span><b>${money(sessOff)}</b></div>
 <div><span class="muted">Total teachers</span><b>${teachersIn(f).length}</b></div></div></div></div>`;
 return h;
}
function openRoll(did,cid){U.rDeptSel=did;U.rSecSel=cid;go('rollcall')}

/* ============ ROLL CALL ============ */
function vRoll(){
 if(!S.depts.length)return topbar('Roll Call')+emptyBox('No departments yet','Add departments in Setup first.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 let d=deptOf(U.rDeptSel)||S.depts[0];U.rDeptSel=d.id;
 if(!d.secs.find(c=>c.id===U.rSecSel))U.rSecSel=d.secs[0]?.id;
 const cid=U.rSecSel,date=U.date;
 const ctl=`<div class="ctl"><select onchange="setU('date',this.value)">${dateOpts(date)}</select></div>`;
 let h=topbar('Sunday Roll Call',fmtD(date)+' · one roll call per Sunday morning',ctl);
 h+=`<div class="card"><div class="chips" style="margin-bottom:10px">${S.depts.map(x=>`<button class="chip ${x.id===d.id?'on':''}" onclick="U.rDeptSel='${x.id}';U.rSecSel=null;rerender()"><i class="dot" style="color:${x.id===d.id?'#fff':x.color}"></i>${esc(x.name)}</button>`).join('')}<button class="chip" onclick="editDept()">＋ Department</button></div>
 <div class="chips">${d.secs.map(c=>{const s=secStat(date,c.id);return `<button class="chip ${c.id===cid?'on':''}" onclick="setU('rSecSel','${c.id}')">${secNm(c.name)} <span class="muted" style="font-weight:500;${c.id===cid?'color:#c7d2fe':''}">${s.T}</span>${s.taken?'<span class="ck">✓</span>':''}</button>`}).join('')||'<span class="muted">No sections. Add sections in Setup.</span>'}</div></div>`;
 if(S.hol[date])return h+`<div class="banner o" style="margin-top:14px">${svg('cal')}<b>No Sunday School this day:</b> ${esc(S.hol[date])}<span class="sp"></span><button class="btn sm" onclick="unHoliday()">Undo – class was held</button></div>`;
 if(!cid)return h;
 const st=studentsOf(cid);
 if(!st.length)return h+`<div style="margin-top:14px">${emptyBox('No students in '+esc(secLabel(cid)),'Add students (one by one or paste a whole list).',`<button class="btn pri" onclick="U.sDept='${d.id}';U.sSec='${cid}';go('students')">Add students</button>`)}</div>`;
 const m=(S.att[date]||{})[cid]||{};const off=((S.off[date]||{})[cid])??'';
 h+=`<div class="card" style="margin-top:14px;position:sticky;top:0;z-index:5"><div class="muted" style="font-size:12.5px;margin-bottom:8px">${svg('teach',14)} Class teacher: <b style="color:var(--ink)">${esc(secTeachers(cid)||'not assigned')}</b></div><div class="rsum" id="rsum"></div>
 <div class="ctl" style="margin-top:10px"><div class="fld" style="flex:1;min-width:150px"><label>Offering collected (${esc(S.settings.cur)})</label><input type="number" inputmode="decimal" min="0" step="any" value="${off}" placeholder="0" onchange="setOff('${cid}',this.value)"></div>
 <div class="ctl" style="align-self:flex-end"><button class="btn ok" onclick="markRest('${cid}')">${svg('check',16)} Rest Present</button><button class="btn" onclick="clearSec('${cid}')">Clear</button><button class="btn" onclick="setHoliday()">No class</button></div></div>
 <input type="search" placeholder="Search name or roll…" style="width:100%;margin-top:10px" oninput="filterRoll(this.value)"></div>`;
 h+=`<div class="card" style="margin-top:10px;padding:6px 10px" id="rlist">${st.map(s=>{const v=m[s.id]||'';return `<div class="srow ${v?'m'+v:''}" data-id="${s.id}" data-k="${esc((s.roll+' '+s.name).toLowerCase())}"><div class="roll">${s.roll}</div><div class="nm"><b>${esc(s.name)}</b><small>${s.g==='F'?'Girl':s.g==='M'?'Boy':''}${s.guardian?' · '+esc(s.guardian):''}</small></div><div class="seg">${['P','A','L'].map(k=>`<button class="${k} ${v===k?'on':''}" onclick="mark('${cid}','${s.id}','${k}')">${k}</button>`).join('')}</div></div>`}).join('')}</div>`;
 const all=d.secs,ix=all.findIndex(c=>c.id===cid);const nx=all[ix+1];const nd=S.depts[S.depts.indexOf(d)+1];
 h+=`<div class="ctl" style="margin-top:12px;justify-content:flex-end">${nx?`<button class="btn pri" onclick="setU('rSecSel','${nx.id}')">Next: ${secNm(nx.name)} →</button>`:nd?`<button class="btn pri" onclick="U.rDeptSel='${nd.id}';U.rSecSel=null;rerender()">Next: ${esc(nd.name)} →</button>`:`<button class="btn pri" onclick="go('dashboard')">Finish → Dashboard</button>`}</div>`;
 setTimeout(updSum,0);return h;
}
function updSum(){const e=$('#rsum');if(!e)return;const s=secStat(U.date,U.rSecSel);e.innerHTML=`<div><b>${s.T}</b><span>Total</span></div><div class="p"><b>${s.P}</b><span>Present</span></div><div class="a"><b>${s.A}</b><span>Absent</span></div><div class="lv"><b>${s.L}</b><span>Leave</span></div><div><b>${s.U}</b><span>Unmarked</span></div>`}
function attMap(date,cid){S.att[date]=S.att[date]||{};return S.att[date][cid]=S.att[date][cid]||{}}
function cleanAtt(date,cid){const a=S.att[date];if(!a)return;if(a[cid]&&!Object.keys(a[cid]).length)delete a[cid];if(!Object.keys(a).length)delete S.att[date]}
function mark(cid,sid,v){stamp('a|'+U.date+'|'+cid);const m=attMap(U.date,cid);if(m[sid]===v)delete m[sid];else m[sid]=v;cleanAtt(U.date,cid);save();
 const r=document.querySelector(`.srow[data-id="${sid}"]`);if(r){const nv=m[sid]||'';r.className='srow'+(nv?' m'+nv:'');r.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent===nv))}updSum()}
function markRest(cid){stamp('a|'+U.date+'|'+cid);const m=attMap(U.date,cid);studentsOf(cid).forEach(s=>{if(!m[s.id])m[s.id]='P'});save();rerender();toast('Remaining students marked Present')}
async function clearSec(cid){if(!await ask('Clear all marks for this section on '+fmtD(U.date)+'?','Clear',true))return;stamp('a|'+U.date+'|'+cid);if(S.att[U.date])delete S.att[U.date][cid];cleanAtt(U.date,cid);save();rerender()}
function setOff(cid,v){stamp('o|'+U.date+'|'+cid);S.off[U.date]=S.off[U.date]||{};const n=parseFloat(v);if(isNaN(n)||n<=0)delete S.off[U.date][cid];else S.off[U.date][cid]=n;if(!Object.keys(S.off[U.date]).length)delete S.off[U.date];save();toast('Offering saved')}
function setHoliday(){modal('No Sunday School this day',`<p>Mark <b>${fmtD(U.date)}</b> as a day with no class. It will be left out of all reports.</p><div class="fld"><label>Reason</label><input type="text" name="r" placeholder="e.g. Christmas, Church programme, Heavy rain"></div>`,[{t:'Cancel'},{t:'Mark as No Class',cls:'pri',fn:w=>{stamp('h|'+U.date);S.hol[U.date]=val(w,'r')||'No class';save();rerender()}}])}
function unHoliday(){stamp('h|'+U.date);delete S.hol[U.date];save();rerender()}
function filterRoll(q){q=q.toLowerCase().trim();document.querySelectorAll('#rlist .srow').forEach(r=>r.style.display=!q||r.dataset.k.includes(q)?'':'none')}

/* ============ TEACHERS ============ */
function vTeach(){
 let h=topbar('Teachers',S.teachers.length+' teachers · attendance & list',`<div class="ctl"><button class="btn pri" onclick="editTeacher()">${svg('plus',16)} Add Teacher</button></div>`);
 h+=`<div class="tabs"><button class="${U.tTab==='att'?'on':''}" onclick="setU('tTab','att')">Sunday Attendance</button><button class="${U.tTab==='list'?'on':''}" onclick="setU('tTab','list')">Teacher List</button></div>`;
 if(!S.teachers.length)return h+emptyBox('No teachers added','Add your Sunday School teachers, superintendent and office bearers.',`<button class="btn pri" onclick="editTeacher()">Add Teacher</button> <button class="btn" onclick="bulkTeachers()">Paste a list</button> <label class="btn">Upload Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importFile(this,'teachers')"></label> <button class="btn" onclick="dlTemplate('teachers')">Excel template</button>`);
 const groups=[...S.depts.map(d=>({id:d.id,name:d.name,color:d.color})),{id:'',name:'General / Office bearers',color:'#64748b'}];
 if(U.tTab==='list'){
  return h+`<div class="ctl" style="margin-bottom:10px"><button class="btn" onclick="bulkTeachers()">Paste a list</button><label class="btn">${svg('dl',16)} Upload Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importFile(this,'teachers')"></label><button class="btn" onclick="dlTemplate('teachers')">Excel template</button></div><div class="card" style="padding:0"><div class="tbl" style="border:0"><table><tr><th>#</th><th>Name</th><th>Role</th><th>Department</th><th>Section</th><th>Phone</th><th class="c">Actions</th></tr>${S.teachers.map((t,i)=>`<tr><td>${i+1}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.role||'')}</td><td>${t.dept?'<i class="dot" style="color:'+(deptOf(t.dept)?.color||'#999')+'"></i> '+esc(deptOf(t.dept)?.name||''):'<span class="muted">General</span>'}</td><td>${t.sec?esc(secInfo(t.sec)?.c.name||''):''}</td><td>${esc(t.phone||'')}</td><td class="c"><button class="btn sm ghost" onclick="editTeacher('${t.id}')">${svg('edit',15)}</button><button class="btn sm ghost" onclick="delTeacher('${t.id}')">${svg('trash',15)}</button></td></tr>`).join('')}</table></div></div>`;
 }
 const date=U.date,ts=tStat(date),m=S.tatt[date]||{};
 h+=`<div class="ctl" style="margin-bottom:12px"><select onchange="setU('date',this.value)">${dateOpts(date)}</select><div class="ctl" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 10px"><span class="muted" style="font-size:12.5px;font-weight:650">Teachers' offering (${esc(S.settings.cur)})</span><input type="number" inputmode="decimal" min="0" step="any" style="width:110px" value="${tOff(date)||''}" placeholder="0" onchange="setTOff(this.value)"></div><button class="btn ok" onclick="tRest()">${svg('check',16)} Rest Present</button></div>`;
 h+=`<div class="kpis" style="margin-bottom:14px">${kpi('Teachers',ts.T,'Offering <b id="tofTot">'+money(tOff(date))+'</b>','#4f46e5','#eef2ff','teach')}${kpi('Present',ts.P,pct(ts.P,ts.T)+'%','#16a34a','#dcfce7','check')}${kpi('Absent',ts.A,'','#dc2626','#fee2e2','x')}${kpi('Leave',ts.L,ts.U?ts.U+' not marked':'All marked','#d97706','#fef3c7','leave')}</div>`;
 groups.forEach(g=>{const list=S.teachers.filter(t=>(t.dept||'')===g.id);if(!list.length)return;

 [{t:'Cancel'},{t:'Add All',cls:'pri',fn:w=>{const sec=val(w,'sec');let n=0;val(w,'list').split(/\r?\n/).forEach(line=>{const p=line.split(/\t|,/).map(x=>x.trim());if(!p[0])return;S.teachers.push({id:newId('t'),name:p[0],role:ROLES.find(r=>r.toLowerCase()===(p[1]||'').toLowerCase())||p[1]||'Teacher',phone:p[2]||'',sec,dept:sec?secInfo(sec).d.id:'',u:now()});n++});save();rerender();toast(n+' teachers added')}}])}

 if(!S.depts.length)return topbar('Students')+emptyBox('No departments yet','Add departments in Setup first.',`<button class="btn pri" onclick="go('setup')">Open Setup</button>`);
 let d=deptOf(U.sDept)||S.depts[0];U.sDept=d.id;if(!d.secs.find(c=>c.id===U.sSec))U.sSec=d.secs[0]?.id;const cid=U.sSec;
 let h=topbar('Students',num(S.students.length)+' students enrolled · '+S.depts.reduce((s,x)=>s+x.secs.length,0)+' sections',`<input type="search" placeholder="Search all students…" value="${esc(U.search)}" oninput="U.search=this.value;clearTimeout(window._st);window._st=setTimeout(()=>{rerender();const i=document.querySelector('.top input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)">`);

  return h+`<div class="card" style="padding:0"><div class="tbl" style="border:0"><table><tr><th>Name</th><th>Class</th><th class="n">Roll</th><th>Guardian</th><th>Phone</th><th class="c">Edit</th></tr>${r.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(secLabel(s.sec))}</td><td class="n">${s.roll}</td><td>${esc(s.guardian||'')}</td><td>${esc(s.phone||'')}</td><td class="c"><button class="btn sm ghost" onclick="editStudent('${s.id}')">${svg('edit',15)}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No match</td></tr>'}</table></div></div>`}
 h+=`<div class="card"><div class="chips" style="margin-bottom:10px">${S.depts.map(x=>`<button class="chip ${x.id===d.id?'on':''}" onclick="U.sDept='${x.id}';U.sSec=null;rerender()"><i class="dot" style="color:${x.id===d.id?'#fff':x.color}"></i>${esc(x.name)} <span style="font-weight:500;opacity:.7">${x.secs.reduce((s,c)=>s+studentsOf(c.id).length,0)}</span></button>`).join('')}<button class="chip" onclick="editDept()">＋ Department</button></div>
 <div class="chips">${d.secs.map(c=>`<button class="chip ${c.id===cid?'on':''}" onclick="setU('sSec','${c.id}')">${secNm(c.name)} <span style="font-weight:500;opacity:.7">${studentsOf(c.id).length}</span></button>`).join('')}</div></div>`;
 if(!cid)return h+`<div style="margin-top:14px">${emptyBox('No sections','Add sections to this department in Setup.')}</div>`;
 const st=studentsOf(cid),cap=+S.settings.cap||60,fill=Math.min(st.length/cap*100,100);
 const teachers=S.teachers.filter(t=>t.sec===cid).map(t=>esc(t.name)).join(', ');
 h+=`<div class="card" style="margin-top:14px"><div class="ctl" style="margin-bottom:12px"><div><b style="font-size:16px">${esc(d.name)} – ${secNm(secInfo(cid).c.name)}</b><div class="muted" style="font-size:12px">Teacher: ${teachers||'not assigned'}</div></div><span class="sp"></span>
 <div class="ctl"><div class="capbar"><i style="width:${fill}%;background:${st.length>cap?'#dc2626':'#4f46e5'}"></i></div><b>${st.length}/${cap}</b></div></div>
 <div class="ctl noprint" style="margin-bottom:12px"><button class="btn pri" onclick="editStudent()">${svg('plus',16)} Add Student</button><button class="btn" onclick="bulkStudents()">Paste a list</button><label class="btn">${svg('dl',16)} Upload Excel<input type="file" accept=".xlsx,.csv" hidden onchange="importFile(this,'students')"></label><button class="btn" onclick="dlTemplate('students')">Excel template</button><button class="btn" onclick="renumber('${cid}')">Re-number rolls A–Z</button><button class="btn" onclick="exportStudents('${cid}')">${svg('dl',16)} CSV</button></div>
 ${st.length?`<div class="tbl"><table><tr><th class="n">Roll</th><th>Name</th><th>Gender</th><th>Guardian</th><th>Phone</th><th class="n">Attendance</th><th class="c">Actions</th></tr>${st.map(s=>{const r=stuRange(s,heldDates());const p=pct(r.P,r.M);return `<tr><td class="n"><b>${s.roll}</b></td><td><b>${esc(s.name)}</b></td><td>${s.g==='F'?'Girl':s.g==='M'?'Boy':''}</td><td>${esc(s.guardian||'')}</td><td>${esc(s.phone||'')}</td><td class="n">${r.M?`<b class="${pctCls(p)}">${p}%</b> <span class="muted">(${r.P}/${r.M})</span>`:'<span class="muted">—</span>'}</td><td class="c"><button class="btn sm ghost" title="Edit / move" onclick="editStudent('${s.id}')">${svg('edit',15)}</button><button class="btn sm ghost" title="Delete" onclick="delStudent('${s.id}')">${svg('trash',15)}</button></td></tr>`}).join('')}</table></div>`:`<div class="empty">No students yet. Use <b>Add Student</b> or <b>Paste a list</b> to add up to ${cap} students.</div>`}</div>`;
 return h;
}
function stuRange(s,dates){const o={P:0,A:0,L:0};dates.forEach(d=>{const v=((S.att[d]||{})[s.sec]||{})[s.id];if(v)o[v]++});o.M=o.P+o.A+o.L;return o}
function nextRoll(cid){return studentsOf(cid).reduce((m,s)=>Math.max(m,+s.roll||0),0)+1}
function editStudent(id){const s=S.students.find(x=>x.id===id)||{sec:U.sSec,roll:nextRoll(U.sSec),g:''};
 modal(id?'Edit Student':'Add Student',`<div class="form"><div class="fld full"><label>Full name *</label><input type="text" name="name" value="${esc(s.name||'')}"></div>
 <div class="fld"><label>Roll No.</label><input type="number" name="roll" min="1" value="${s.roll}"></div>
 <div class="fld"><label>Gender</label><select name="g"><option value="">—</option><option value="M" ${s.g==='M'?'selected':''}>Boy</option><option value="F" ${s.g==='F'?'selected':''}>Girl</option></select></div>
 <div class="fld"><label>Parent / Guardian</label><input type="text" name="guardian" value="${esc(s.guardian||'')}"></div>
 <div class="fld"><label>Phone</label><input type="tel" name="phone" value="${esc(s.phone||'')}"></div>
 <div class="fld full"><label>Department – Section ${id?'(change to move student)':''}</label><select name="sec">${secOptsAll(s.sec)}</select></div></div>`,
 [{t:'Cancel'},...(id?[]:[{t:'Save & Add Next',fn:w=>{if(saveStu(w,null)){const f=w.querySelector('[name=name]');f.value='';w.querySelector('[name=roll]').value=nextRoll(val(w,'sec'));w.querySelector('[name=guardian]').value='';w.querySelector('[name=phone]').value='';f.focus();toast('Student added');rerender()}return false}}]),{t:id?'Save':'Add Student',cls:'pri',fn:w=>{if(!saveStu(w,id))return false;rerender();toast(id?'Student updated':'Student added')}}])}
function saveStu(w,id){const name=val(w,'name');if(!name){toast('Please enter the student name');return false}const sec=val(w,'sec');
 const o={name,roll:parseInt(val(w,'roll'))||nextRoll(sec),g:val(w,'g'),guardian:val(w,'guardian'),phone:val(w,'phone'),sec,u:now()};
 if(!id&&studentsOf(sec).length>=(+S.settings.cap||60))toast('Note: section now has more than '+S.settings.cap+' students');
 if(id){const s=S.students.find(x=>x.id===id);if(s.sec!==sec){for(const d in S.att){const a=S.att[d][s.sec];if(a&&a[id]){stamp('a|'+d+'|'+sec);stamp('a|'+d+'|'+s.sec);attMapD(d,sec)[id]=a[id];delete a[id]}}}Object.assign(s,o)}else S.students.push(Object.assign({id:newId('s')},o));
 save();return true}
function attMapD(d,cid){S.att[d]=S.att[d]||{};return S.att[d][cid]=S.att[d][cid]||{}}
async function delStudent(id){const s=S.students.find(x=>x.id===id);if(!await ask(`Delete <b>${esc(s.name)}</b> from the register? Their attendance history will also be removed.`,'Delete',true))return;S.students=S.students.filter(x=>x.id!==id);(S.del=S.del||{})[id]=now();save();rerender()}
function bulkStudents(){const cid=U.sSec;modal('Paste student list – '+esc(secLabel(cid)),`<p class="muted">One student per line: <b>Name, Gender (M/F), Guardian, Phone</b>. Only the name is required. You can copy columns straight from Excel. Roll numbers continue from ${nextRoll(cid)}.</p><textarea name="list" style="width:100%;height:240px" placeholder="Lalrinpuii, F, Lalthanga, 9876543210&#10;Joseph, M&#10;Esther"></textarea>`,
 [{t:'Cancel'},{t:'Add All',cls:'pri',fn:w=>{let r=nextRoll(cid),n=0;val(w,'list').split(/\r?\n/).forEach(line=>{const p=line.split(/\t|,/).map(x=>x.trim());if(!p[0])return;let g=(p[1]||'').toUpperCase();g=g.startsWith('F')||g.startsWith('G')?'F':g.startsWith('M')||g.startsWith('B')?'M':'';S.students.push({id:newId('s'),name:p[0],g,guardian:p[2]||'',phone:p[3]||'',roll:r++,sec:cid,u:now()});n++});save();rerender();toast(n+' students added')}}])}
async function renumber(cid){if(!await ask('Re-number roll numbers 1, 2, 3… in alphabetical order of names for this section?','Re-number'))return;studentsOf(cid).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach((s,i)=>{s.roll=i+1;s.u=now()});save();rerender();toast('Roll numbers updated')}
function exportStudents(cid){const rows=[['Roll','Name','Gender','Guardian','Phone','Department','Section']];const i=secInfo(cid);studentsOf(cid).forEach(s=>rows.push([s.roll,s.name,s.g,s.guardian||'',s.phone||'',i.d.name,i.c.name]));download(`Students_${i.d.name}_${i.c.name}.csv`,'﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}

const rangeSel=(withS=true)=>`<select onchange="setU('rRange',this.value)">${monthOpts(U.rRange,withS)}</select>`;
function rWeekly(){const d=U.date,a=aggDate(d),t=tStat(d);
 let b=S.hol[d]?`<div class="banner o">No Sunday School on this day — ${esc(S.hol[d])}</div>`:'';
 b+=`<div class="tbl"><table data-title="Weekly report ${fmtD(d)}"><tr><th>Department</th><th>Section</th><th>Teacher</th><th class="n">Enrolled</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th class="n">Not marked</th><th class="n">Attendance %</th><th class="n">Offering</th></tr>`;
 a.depts.forEach(x=>{x.secs.forEach((s,i)=>{const M=s.P+s.A+s.L;b+=`<tr><td>${i?'':'<b>'+esc(x.d.name)+'</b>'}</td><td>${esc(s.c.name)}</td><td>${esc(secTeachers(s.c.id))}</td><td class="n">${s.T}</td><td class="n">${s.P}</td><td class="n">${s.A}</td><td class="n">${s.L}</td><td class="n">${s.U}</td><td class="n">${M?pct(s.P,M)+'%':'—'}</td><td class="n">${s.off?money(s.off):'—'}</td></tr>`});
  const M=x.P+x.A+x.L;b+=`<tr class="sub"><td>${esc(x.d.name)} total</td><td></td><td></td><td class="n">${x.T}</td><td class="n">${x.P}</td><td class="n">${x.A}</td><td class="n">${x.L}</td><td class="n">${x.U}</td><td class="n">${pct(x.P,M)}%</td><td class="n">${money(x.off)}</td></tr>`});
 b+=`<tr class="tot"><td>GRAND TOTAL</td><td></td><td></td><td class="n">${a.T}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td class="n">${a.U}</td><td class="n">${pct(a.P,a.M)}%</td><td class="n">${money(a.off)}</td></tr></table></div>`;
 const cbk=combinedBlock([d]);b+=cbk.html;
 return[`<select onchange="setU('date',this.value)">${dateOpts(d)}</select>`,'Weekly Attendance Report','Sunday, '+fmtD(d),b,{tiles:cbk.tiles}]}
function rMonthly(){const r=U.rRange==='session'?U.rMonth:U.rRange;const dates=rangeDates(r);
 let b=`<div class="tbl"><table data-title="Section-wise ${monthName(r)}"><tr><th>Department</th><th>Section</th><th>Teacher</th><th class="n">Enrolled</th><th class="n">Sundays</th><th class="n">Total P</th><th class="n">Total A</th><th class="n">Total L</th><th class="n">Avg present</th><th class="n">Attendance %</th><th class="n">Offering</th></tr>`;
 const G={T:0,P:0,A:0,L:0,off:0};
 S.depts.forEach(d=>{const D={T:0,P:0,A:0,L:0,off:0};d.secs.forEach((c,i)=>{const s=secRange(c.id,dates),T=studentsOf(c.id).length;b+=`<tr><td>${i?'':'<b>'+esc(d.name)+'</b>'}</td><td>${esc(c.name)}</td><td>${esc(secTeachers(c.id))}</td><td class="n">${T}</td><td class="n">${s.held}</td><td class="n">${s.P}</td><td class="n">${s.A}</td><td class="n">${s.L}</td><td class="n">${s.held?(s.P/s.held).toFixed(1):'—'}</td><td class="n">${s.M?pct(s.P,s.M)+'%':'—'}</td><td class="n">${money(s.off)}</td></tr>`;D.T+=T;D.P+=s.P;D.A+=s.A;D.L+=s.L;D.off+=s.off});
  b+=`<tr class="sub"><td>${esc(d.name)} total</td><td></td><td></td><td class="n">${D.T}</td><td class="n"></td><td class="n">${D.P}</td><td class="n">${D.A}</td><td class="n">${D.L}</td><td class="n">${dates.length?(D.P/dates.length).toFixed(1):'—'}</td><td class="n">${pct(D.P,D.P+D.A+D.L)}%</td><td class="n">${money(D.off)}</td></tr>`;['T','P','A','L','off'].forEach(k=>G[k]+=D[k])});
 b+=`<tr class="tot"><td>GRAND TOTAL</td><td></td><td></td><td class="n">${G.T}</td><td class="n">${dates.length}</td><td class="n">${G.P}</td><td class="n">${G.A}</td><td class="n">${G.L}</td><td class="n">${dates.length?(G.P/dates.length).toFixed(1):'—'}</td><td class="n">${pct(G.P,G.P+G.A+G.L)}%</td><td class="n">${money(G.off)}</td></tr></table></div>`;
 b+=`<h3 style="margin-top:16px">Sunday-by-Sunday</h3><div class="tbl"><table data-title="Sunday-by-Sunday ${monthName(r)}"><tr><th>Date</th><th class="n">Enrolled</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th class="n">Attendance %</th><th class="n">Students offering</th><th class="n">Teachers present</th><th class="n">Teachers offering</th><th class="n">Total offering</th></tr>${sundays().filter(d=>d.startsWith(r)).map(d=>{if(S.hol[d])return `<tr><td>${fmtD(d)}</td><td colspan="9" class="muted">No class — ${esc(S.hol[d])}</td></tr>`;if(!isHeld(d))return `<tr><td>${fmtD(d)}</td><td colspan="9" class="muted">Not recorded</td></tr>`;const a=aggDate(d),t=tStat(d);return `<tr><td>${fmtD(d)}</td><td class="n">${a.T}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td class="n">${pct(a.P,a.M)}%</td><td class="n">${money(a.off)}</td><td class="n">${t.P}/${t.T}</td><td class="n">${money(tOff(d))}</td><td class="n"><b>${money(a.off+tOff(d))}</b></td></tr>`}).join('')}</table></div>`;
 const cbk=combinedBlock(dates);b+=cbk.html;
 return[`<select onchange="U.rRange=this.value;U.rMonth=this.value;rerender()">${monthOpts(r,false)}</select>`,'Monthly Attendance Report',monthName(r)+` · ${dates.length} Sunday(s) held`,b,{tiles:cbk.tiles}]}
function rAnnual(){const ms=months();let G={P:0,A:0,L:0,off:0,n:0,tp:0};const pts=[];

async function importFile(inp,kind){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
 try{let rows;if(/\.csv$/i.test(f.name)||/text/.test(f.type))rows=parseCSV(await f.text());else{const sh=await readXlsx(f);const re=new RegExp(kind==='students'?'student':'teacher','i');const pick=sh.find(s=>re.test(s.name))||sh.find(s=>s.rows.some(r=>r.some(c=>/name/i.test(c))))||sh[0];rows=pick?pick.rows:[]}
  const hi=rows.findIndex(r=>r.some(c=>/name/i.test(String(c))&&!/guardian|parent/i.test(String(c))));
  if(hi<0)throw 'No header row with a "Name" column was found. Please use the template.';
  const m=mapCols(rows[hi]);if(m.name==null)throw 'The "Name" column is missing.';
  const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));
  const snap=JSON.stringify({d:S.depts,s:S.students,t:S.teachers});
  const restore=()=>{const o=JSON.parse(snap);S.depts=o.d;S.students=o.s;S.teachers=o.t;_idx=null};
  const r=kind==='students'?impStudents(data,m):impTeachers(data,m);_idx=null;
  const lbl=kind==='students'?'students':'teachers';
  modal('Upload '+lbl,`<p>File: <b>${esc(f.name)}</b> · ${data.length} rows</p><div class="lst">
   <div><span>New ${lbl} to add</span><b class="ok">${r.add}</b></div><div><span>Existing ${lbl} to update</span><b>${r.upd}</b></div><div><span>Rows skipped (no name)</span><b>${r.skip}</b></div>
   ${r.nd.length?`<div><span>New departments</span><b>${esc(r.nd.join(', '))}</b></div>`:''}${r.ns.length?`<div><span>New sections</span><b style="text-align:right">${esc(r.ns.slice(0,12).join(', '))}${r.ns.length>12?' …':''}</b></div>`:''}</div>
   ${r.errs.length?`<div class="banner o" style="margin-top:12px;display:block">${r.errs.slice(0,8).map(esc).join('<br>')}${r.errs.length>8?'<br>…':''}</div>`:''}`,
   [{t:'Cancel',fn:restore},{t:'Import now',cls:'pri',fn:()=>{save();rerender();toast(`${r.add} added · ${r.upd} updated`)}}],restore)
 }catch(e){restoreNoop();toast(esc(String(e&&e.message||e)))}}
function restoreNoop(){}
function impStudents(data,m){const r={add:0,upd:0,skip:0,nd:[],ns:[],errs:[]};const cache={};const list=cid=>cache[cid]||(cache[cid]=studentsOf(cid).slice());
 const defD=deptOf(U.sDept)||S.depts[0];const defC=defD&&(defD.secs.find(c=>c.id===U.sSec)||defD.secs[0]);
 data.forEach((row,i)=>{const g=k=>m[k]==null?'':String(row[m[k]]??'').trim();const name=g('name');if(!name){r.skip++;return}
  const dn=g('dept'),sn=g('sec').replace(/^(section|sec\.?)\s*/i,'').trim();
  let d=dn?S.depts.find(x=>x.name.trim().toLowerCase()===dn.toLowerCase()):defD;
  if(!d&&dn){d={id:newId('d'),name:dn,color:COLORS[S.depts.length%COLORS.length],secs:[],u:now(),o:maxO()+1};S.depts.push(d);r.nd.push(dn)}
  if(!d){r.skip++;r.errs.push('Row '+(i+2)+': department missing');return}
  let c=sn?d.secs.find(x=>x.name.trim().toLowerCase()===sn.toLowerCase()):(d===defD&&defC?defC:d.secs[0]);
  if(!c){const nm=sn||'A';c={id:newId('c'),name:nm};d.secs.push(c);d.u=now();r.ns.push(d.name+' – '+nm)}
  const L=list(c.id),roll=parseInt(g('roll'));let gd=g('g').toUpperCase();gd=/^(F|G|W)/.test(gd)?'F':/^(M|B)/.test(gd)?'M':'';
  const ex=!isNaN(roll)?L.find(s=>+s.roll===roll):L.find(s=>s.name.toLowerCase()===name.toLowerCase());
  const o={name,g:gd,guardian:g('guardian'),phone:g('phone'),u:now()};
  if(ex){Object.assign(ex,o);r.upd++}else{const s=Object.assign({id:newId('s'),roll:isNaN(roll)?L.reduce((a,x)=>Math.max(a,+x.roll||0),0)+1:roll,sec:c.id},o);S.students.push(s);L.push(s);r.add++}});
 return r}
function impTeachers(data,m){const r={add:0,upd:0,skip:0,nd:[],ns:[],errs:[]};
 data.forEach((row,i)=>{const g=k=>m[k]==null?'':String(row[m[k]]??'').trim();const name=g('name');if(!name){r.skip++;return}
  const dn=g('dept'),sn=g('sec').replace(/^(section|sec\.?)\s*/i,'').trim();const d=dn?S.depts.find(x=>x.name.trim().toLowerCase()===dn.toLowerCase()):null;const c=d&&sn?d.secs.find(x=>x.name.trim().toLowerCase()===sn.toLowerCase()):null;
  if(dn&&!d)r.errs.push(`Row ${i+2}: department "${dn}" not found – saved as General`);else if(d&&sn&&!c)r.errs.push(`Row ${i+2}: section "${sn}" not found in ${d.name}`);
  const role=ROLES.find(x=>x.toLowerCase()===g('role').toLowerCase())||g('role')||'Teacher';
  const o={name,role,phone:g('phone'),dept:d?d.id:'',sec:c?c.id:'',u:now()};
  const ex=S.teachers.find(t=>t.name.trim().toLowerCase()===name.toLowerCase());if(ex){Object.assign(ex,o);r.upd++}else{S.teachers.push(Object.assign({id:newId('t')},o));r.add++}});

 downloadBlob(`SundaySchool_${fn||U.rTab+'_report'}_${iso(new Date())}.xlsx`,XL.book([{name:'Report',rows,cols:wid.map(w=>w||10)}]))}

function initPad(k){const c=document.getElementById('pad_'+k);if(!c)return;const ctx=c.getContext('2d');c.dataset.empty='1';
 const img=S.settings['sig_'+k];if(img){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,c.width,c.height);c.dataset.empty='0'};im.src=img}
 let dr=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dr=true;last=pos(e);try{c.setPointerCapture(e.pointerId)}catch(_){}c.dataset.empty='0';ctx.beginPath();ctx.arc(last[0],last[1],2.6,0,7);ctx.fillStyle='#0b1f6b';ctx.fill()};
 c.onpointermove=e=>{if(!dr)return;const p=pos(e);ctx.lineWidth=5.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f6b';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
 c.onpointerup=c.onpointercancel=c.onpointerleave=()=>{dr=false}}
function padClear(k){const c=document.getElementById('pad_'+k);c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.empty='1'}
function padUpload(k,inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.getElementById('pad_'+k),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const sc=Math.min(c.width/im.width,c.height/im.height);const w=im.width*sc,h=im.height*sc;ctx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);c.dataset.empty='0'};im.src=r.result};r.readAsDataURL(f)}
function padSave(k){const c=document.getElementById('pad_'+k);S.settings[k]=document.getElementById('sn_'+k).value.trim();S.settings['sig_'+k]=c.dataset.empty==='1'?'':c.toDataURL('image/png');S.su=now();save();rerender();toast('Signature saved – it will print on all reports')}

async function pack(o){const j=JSON.stringify(o);if(typeof CompressionStream==='undefined')return 'J:'+j;const b=new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return 'G:'+btoa(bin)}

function kget(X,k){const p=k.split('|');if(p[0]==='a')return X.att?.[p[1]]?.[p[2]];if(p[0]==='o')return X.off?.[p[1]]?.[p[2]];if(p[0]==='t')return X.tatt?.[p[1]];if(p[0]==='h')return X.hol?.[p[1]];if(p[0]==='r')return X.res?.[p[1]]?.[p[2]];if(p[0]==='q')return X.toff?.[p[1]]}

 const mList=(a,b)=>{const m=new Map();a.forEach(x=>m.set(x.id,x));b.forEach(x=>{const y=m.get(x.id);if(!y||(x.u||0)>(y.u||0)){m.set(x.id,x);ch=true}});const out=[...m.values()].filter(x=>!((L.del[x.id]||0)>=(x.u||0)&&L.del[x.id]));if(out.length!==m.size)ch=true;return out};

async function syncNow(manual){
 if(!cfg.url||!cfg.key){if(manual)toast('Set up Cloud Sync first (Setup → Cloud Sync)');return}
 if(!navigator.onLine){setSync();if(manual)toast('No internet – changes are saved and will upload later');return}
 if(syncing)return;syncing=true;setSync();let changed=false;
 try{let r=await api({action:'pull',rev:cfg.rev??-1});if(!r.ok)throw r.error||'Sync failed';let rev=r.rev;
  if(!r.same&&r.data){const R=await unpack(r.data);if(R){applying=true;changed=mergeState(R)||changed;applying=false}}
  if(cfg.dirty||rev===0){
   for(let i=0;i<4;i++){const seq=changeSeq;const due=manual||Date.now()-(cfg.lastSum||0)>10*60e3;
    const p=await api({action:'push',base:rev,data:await pack(S),device:cfg.device||'',summary:due?buildSummary():null});
    if(p.ok){rev=p.rev;if(due)cfg.lastSum=Date.now();if(seq===changeSeq)cfg.dirty=false;else schedule(4000);break}
    if(p.conflict){const r2=await api({action:'pull',rev:-1});if(!r2.ok)throw r2.error;const R=await unpack(r2.data);applying=true;changed=mergeState(R)||changed;applying=false;rev=r2.rev;continue}
    throw p.error||'Upload failed'}}
  cfg.rev=rev;cfg.last=Date.now();cfg.err='';saveCfg();
  if(changed){saveRaw();softRerender()}
  if(manual)toast('Synced with cloud ✓')}
 catch(e){applying=false;cfg.err=String(e);saveCfg();if(manual)toast('Sync failed: '+esc(String(e)))}
 finally{syncing=false;setSync();if(U.view==='setup'&&U.sTab==='sync')softRerender()}}

 if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){toast('Paste the Web App URL from Apps Script (starts with https://script.google.com/)');return}
 if(!key){toast('Enter the sync key');return}
 const old=cfg;cfg=Object.assign({},cfg,{url,key,device:g('sy_dev').value.trim(),auto:g('sy_auto').checked,err:''});
 if(old.url!==url||old.key!==key){delete cfg.rev}
 toast('Connecting…');
 try{const r=await api({action:'pull',rev:-1});if(!r.ok)throw r.error||'Could not connect';
  const R=r.data?await unpack(r.data):null;const hasCloud=R&&Array.isArray(R.depts)&&(R.students.length||R.teachers.length);
  const hasLocal=!S.pristine&&(S.students.length||S.teachers.length);
  if(hasCloud&&hasLocal){const choice=await new Promise(res=>modal('Cloud already has data',`<p>The cloud has <b>${R.students.length} students</b> and <b>${R.teachers.length} teachers</b>. This device also has data (${S.students.length} students).</p><p class="muted">Recommended for a new phone/laptop: <b>use the cloud data</b>.</p>`,[{t:'Merge both',fn:()=>res('merge')},{t:'Use cloud data',cls:'pri',fn:()=>res('cloud')}],()=>res(null)));
   if(!choice){cfg=old;return}
   if(choice==='cloud'){S=normalize(R);S.pristine=false;saveRaw();cfg.rev=r.rev;cfg.dirty=false}else{cfg.dirty=true}}
  else if(hasCloud){S=normalize(R);S.pristine=false;saveRaw();cfg.rev=r.rev;cfg.dirty=false}
  else{cfg.dirty=true}
  saveCfg();render();await syncNow(true)}
 catch(e){cfg=Object.assign(cfg,{err:String(e)});saveCfg();rerender();toast('Could not connect: '+esc(String(e)))}}
